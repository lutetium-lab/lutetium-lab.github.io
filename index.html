    $$("button[data-r]",host).forEach(b=>b.onclick=()=>{ const s=st[+b.dataset.r]; s.done=true; s.ok=false; r(); });
    $$("button[data-n]",host).forEach(b=>b.onclick=()=>{ const i=+b.dataset.n, q=qs[i], s=st[i]; s.val=$("#mq"+i,host).value; const n=numIn(s.val); s.ok=!isNaN(n)&&Math.abs(n-q.ans)<=Math.abs(q.ans)*(q.tol||0)+(q.abs||0); if(s.ok) toast("✔ إجابة صحيحة"); r(); }); }
  r(); }
const modelShell=(side)=>`<div class="model"><div class="stagebox"><svg id="ms" viewBox="0 0 800 460"></svg></div><div class="stack">${side}<div id="mquiz"></div></div></div>`;

/* ---- M6: فصل المخاليط (الأشكال 13-2 إلى 15-2 · ص 56) ---- */
function mSep(el){
  const INFO={filt:["الترشيح","يفصل مادة صلبة غير ذائبة عن سائل. تمر جسيمات السائل الصغيرة عبر مسامات ورقة الترشيح، وتبقى جسيمات الرمل الكبيرة فوقها.","حجم الجسيمات"],
    dist:["التقطير","يُسخَّن المخلوط فتتبخر المادة الأقل درجة غليان (الماء)، ثم يتكثف البخار في المكثف البارد ويُجمع ماءً نقيًا، ويبقى الملح في الدورق.","درجة الغليان"],
    cryst:["التبلور","عند تبخر الماء من محلول السكر المشبع تزداد تركيزه، فتترسب جزيئات السكر على الخيط على شكل بلورات صلبة نقية.","الذائبية"],

  const ui=()=>{ const I=INFO[mode]; $("#sepi").innerHTML=`<b style="font-family:var(--display);font-size:20px;color:var(--cyan)">${I[0]}</b><br>${I[1]}<br><span class="tag a" style="margin-top:6px">الخاصية الفيزيائية المستعملة: ${I[2]}</span>`; };
  bindSeg("sepm",v=>{ mode=v; p=0; play=false; ui(); });
  $("#sepP").onclick=()=>{ if(p>=1) p=0; play=true; }; $("#sepR").onclick=()=>{ p=0; play=false; };
  $("#sepS").oninput=e=>{ p=+e.target.value/100; play=false; };
  const svg=$("#ms"); let T=0;
  function draw(){ let v=stageBg();
    if(mode==="filt"){ const pour=Math.min(1,p*1.1);
      v+=`<g transform="rotate(${-20-pour*35} 250 170)">${KIT.beaker(250,230,110,120,.55*(1-pour),"rgba(150,110,60,.55)")}</g>`;
      if(p>0&&p<.95) v+=`<path d="M${300} ${150+pour*20} Q380 180 ${400} 200" stroke="rgba(150,110,60,.6)" stroke-width="6" fill="none"/>`;
      v+=`<path d="M340 190 L460 190 L412 270 L388 270Z" fill="#fff" stroke="#A6CAFF" stroke-width="2"/><path d="M345 192 L455 192 L405 262 L395 262Z" fill="#f7f7f2" stroke="#ddd"/>`;
      v+=`<path d="M${400-40*pour} ${258-40*pour} L${400+40*pour} ${258-40*pour} L405 262 L395 262Z" fill="#C8A165"/>`;
      v+=`<rect x="394" y="270" width="12" height="60" fill="#fff" stroke="#A6CAFF"/>`; if(p>.05&&p<.98){ const y=330+((T*120)%60); v+=`<circle cx="400" cy="${y}" r="3" fill="#8FD8FF"/>`; }
      v+=KIT.flask(400,420,150,190,.55*p,"rgba(143,216,255,.55)",{label:"الراشح (ماء)"});
      v+=tx(400,180,"ورقة الترشيح")+tx(250,300,"رمل + ماء")+tx(520,250,"الراسب: الرمل","fill:#A0702D");
    }
    if(mode==="dist"){ const Tc=Math.min(100,25+p*400);
      v+=KIT.burner(170,420,p>0,T); v+=KIT.flask(170,340,120,150,.6-.35*p,"rgba(120,190,255,.45)",{label:""}); v+=tx(170,440,"ماء مالح","",);
      v+=`<rect x="162" y="140" width="16" height="60" rx="4" fill="#fff" stroke="#A6CAFF"/><g transform="translate(200 0)">${KIT.thermo(0,220,110,Tc,0,110)}</g>`+ltx(236,120,Tc.toFixed(0)+" °C","fill:#D9822B");
      v+=`<path d="M178 170 L560 290" stroke="#A6CAFF" stroke-width="20" stroke-linecap="round" opacity=".55"/><path d="M178 170 L560 290" stroke="#fff" stroke-width="10" stroke-linecap="round"/>`;
      v+=`<path d="M300 205 L500 268" stroke="rgba(77,149,255,.25)" stroke-width="36" stroke-linecap="round"/>`+tx(420,210,"المكثف (ماء بارد)","fill:#3A7FEA");
      if(p>.18){ for(let i=0;i<8;i++){ const k=((T*.35+i/8)%1); const x=178+k*382, y=170+k*120; v+=`<circle cx="${x}" cy="${y}" r="${k<.4?4:3}" fill="${k<.4?"#fff":"#8FD8FF"}" opacity=".9"/>`; } const y=300+((T*90)%50); v+=`<circle cx="566" cy="${y}" r="3.5" fill="#8FD8FF"/>`; }
      v+=KIT.beaker(580,420,90,90,Math.max(0,(p-.18))*.9,"rgba(143,216,255,.55)",{label:"ماء مقطر نقي"});
      if(p>.9) v+=`<g>${[0,1,2,3,4].map(i=>`<rect x="${150+i*9}" y="${330-(i%2)*5}" width="8" height="8" fill="#fff" stroke="#ccc"/>`).join("")}</g>`+tx(170,300,"ملح متبقٍّ","fill:#6B7890");
    }
    if(mode==="cryst"){ v+=KIT.beaker(400,410,200,230,.62-.3*p,"rgba(180,210,255,.45)",{label:"محلول سكر مشبع"}); v+=`<rect x="290" y="170" width="220" height="8" rx="4" fill="url(#gMetal)"/><line x1="400" y1="178" x2="400" y2="380" stroke="#C8A165" stroke-width="2"/>`;
      const n=Math.floor(p*26); for(let i=0;i<n;i++){ const y=372-i*7.5, s=6+((i*37)%7)+p*4, x=400+((i%2)?5:-5)-s/2; v+=`<rect x="${x}" y="${y}" width="${s}" height="${s}" transform="rotate(${(i*23)%40} ${x+s/2} ${y+s/2})" fill="#fff" stroke="#9fb5d6" opacity=".95"/>`; }
      if(p>0&&p<1) for(let i=0;i<3;i++){ const y=240-((T*25+i*25)%70); v+=`<path d="M${360+i*40} ${y+20} q7 -8 0 -16 q-7 -8 0 -16" stroke="#A6CAFF" stroke-width="3" fill="none" opacity=".7"/>`; }
      v+=tx(560,260,"بلورات السكر","fill:#4F29B6")+tx(560,280,"تتكوّن على الخيط","");
    }
    if(mode==="chrom"){ v+=KIT.beaker(400,420,160,300,.14,"rgba(143,216,255,.55)",{label:"مذيب (ماء)"});
      const bx=360,bw=80,bt=110,bb=410; v+=`<rect x="${bx}" y="${bt}" width="${bw}" height="${bb-bt}" fill="#fff" stroke="#ddd"/><rect x="300" y="100" width="200" height="8" rx="4" fill="url(#gMetal)"/>`;
      const base=375, front=base-(base-130)*p; v+=`<rect x="${bx}" y="${front}" width="${bw}" height="${bb-front}" fill="rgba(143,216,255,.28)"/><line x1="${bx}" x2="${bx+bw}" y1="${front}" y2="${front}" stroke="#4D95FF" stroke-dasharray="4 3"/>`;
      v+=`<line x1="${bx-6}" x2="${bx+bw+6}" y1="${base}" y2="${base}" stroke="#888" stroke-dasharray="2 3"/>`;
      const comps=[["#3A7FEA",.82,"أزرق"],["#E05A5A",.55,"أحمر"],["#E8B400",.28,"أصفر"]];
      if(p<.05) v+=`<circle cx="400" cy="${base}" r="7" fill="#222"/>`;
      else comps.forEach(([c,rf,n])=>{ const y=base-(base-front)*rf; v+=`<ellipse cx="400" cy="${y}" rx="${8+p*5}" ry="${6+p*6}" fill="${c}" opacity=".75"/>`; if(p>.6) v+=`<text x="${bx+bw+12}" y="${y+5}" class="lbl2" text-anchor="end">${n}: Rf ≈ ${rf}</text>`; });
      v+=tx(bx-60,front+5,"خط المذيب","fill:#3A7FEA")+tx(bx-60,base+5,"خط البداية","");
    }
    svg.innerHTML=v; }
  loopModel(dt=>{ T+=dt; if(play){ p=Math.min(1,p+dt/7); if(p>=1) play=false; } $("#sepv").textContent=Math.round(p*100)+"%"; $("#sepS").value=Math.round(p*100); draw(); });
  ui();
  mQuiz($("#mquiz"),[
    {q:"أي طريقة تناسب فصل الرمل عن الماء؟",o:["الترشيح","التقطير","الكروماتوجرافيا"],a:0,why:"الرمل لا يذوب في الماء وجسيماته أكبر من مسامات ورقة الترشيح."},

    {q:"أي خاصية فيزيائية يعتمد عليها التبلور؟",o:["الذائبية: تقل كمية السكر الذائبة مع تبخر الماء فيترسب","درجة الانصهار","اللون"],a:0},
  ]);
}

/* ---- M7: التحليل الكهربائي للماء (الشكل 18-2 · ص 60) ---- */
function mElec(el){
  let on=false, V=9, h=0, o=0, test=null, bubH=[], bubO=[];
  el.innerHTML=modelShell(`<div class="card stack" style="gap:12px">
    <div class="row"><button class="btn pri" id="elOn">⚡ شغّلي التيار</button><button class="btn ghost" id="elR">↺ إعادة</button></div>

    <div class="grid g3"><div class="stat"><span>حجم H₂</span><b id="elH">0.0 mL</b></div><div class="stat"><span>حجم O₂</span><b id="elO">0.0 mL</b></div><div class="stat"><span>النسبة H₂ : O₂</span><b id="elQ">—</b></div></div>
    <div class="row"><button class="btn sm" id="tH">🔥 اختبري غاز الأنبوب الأيمن</button><button class="btn sm" id="tO">🔥 اختبري غاز الأنبوب الأيسر</button></div>
    <div class="note i small" id="elMsg">شغّلي التيار وراقبي الغازين. أين يتجمع حجم أكبر؟</div>
    <div class="note g small" style="direction:ltr;text-align:center;font-family:var(--mono);font-size:16px">2H₂O(l) → 2H₂(g) + O₂(g)</div></div>`);
  $("#elOn").onclick=()=>{ on=!on; $("#elOn").textContent=on?"⏸ أوقفي التيار":"⚡ شغّلي التيار"; };
  $("#elR").onclick=()=>{ h=0;o=0;test=null;bubH=[];bubO=[]; };
  $("#elV").oninput=e=>{ V=+e.target.value; $("#elVv").textContent=V+" V"; };
  $("#tH").onclick=()=>{ if(h<4){ $("#elMsg").textContent="اجمعي كمية كافية من الغاز أولًا."; return; } test="H"; $("#elMsg").innerHTML="💥 <b>فرقعة!</b> الغاز في الأنبوب الأيمن (عند المهبط السالب) هو <b>الهيدروجين H₂</b>."; };
  $("#tO").onclick=()=>{ if(o<2){ $("#elMsg").textContent="اجمعي كمية كافية من الغاز أولًا."; return; } test="O"; $("#elMsg").innerHTML="✨ <b>توهّجت الشظية واشتعلت بشدة!</b> الغاز في الأنبوب الأيسر (عند المصعد الموجب) هو <b>الأكسجين O₂</b>."; };
  const svg=$("#ms"); let T=0;

    $("#elH").textContent=h.toFixed(1)+" mL"; $("#elO").textContent=o.toFixed(1)+" mL"; $("#elQ").textContent=o>.5?(h/o).toFixed(2)+" : 1":"—";
    let v=stageBg(); const tube=(cx,gas,lab,col)=>{ const top=100,bot=350, gy=top+10+(bot-top-10)*(gas/44); return `<rect x="${cx-22}" y="${top}" width="44" height="${bot-top}" rx="20" fill="rgba(143,216,255,.45)" stroke="var(--glassware)" stroke-width="2"/><rect x="${cx-20}" y="${top+2}" width="40" height="${gy-top}" rx="18" fill="${col}" opacity=".35"/>${[0,1,2,3,4].map(i=>`<line x1="${cx+10}" x2="${cx+22}" y1="${top+30+i*50}" y2="${top+30+i*50}" class="tick"/>`).join("")}${tx(cx,80,lab)}`; };
    v+=`<path d="M340 350 V380 H460 V350" stroke="var(--glassware)" stroke-width="14" fill="none" opacity=".5"/>`;
    v+=tube(340,o,"غاز الأكسجين","#FF8080")+tube(460,h,"غاز الهيدروجين","#A6CAFF");
    v+=`<rect x="334" y="330" width="12" height="30" fill="#5d6a84"/><rect x="454" y="330" width="12" height="30" fill="#5d6a84"/>`;
    v+=KIT.bubbles(bubH)+KIT.bubbles(bubO);
    v+=`<rect x="360" y="400" width="80" height="50" rx="8" fill="#8B5A2B"/><rect x="372" y="392" width="14" height="10" fill="#333"/><rect x="414" y="392" width="14" height="10" fill="#333"/>${ltx(400,432,V+"V","fill:#fff")}`;

/* ---- M9: تجربة قطرة الزيت لمليكان (الشكل 8-3 · ص 83) ---- */

  const svg=$("#ms"); let T=0, bg=[]; for(let i=0;i<18;i++) bg.push({x:rnd(300,500),y:rnd(130,300),v:rnd(8,20)});

    {q:"لماذا كان انحراف جسيمات ألفا أقل كثيرًا من انحراف جسيمات بيتا؟",o:["لأن كتلة جسيم ألفا أكبر بكثير من كتلة جسيم بيتا","لأن شحنة ألفا أصغر","لأن ألفا لا تتأثر بالكهرباء"],a:0,why:"الجسيم الأثقل يصعب تغيير مساره."},
    {q:"لماذا لم تنحرف أشعة جاما؟",o:["لأنها لا تحمل شحنة كهربائية","لأنها ثقيلة جدًا","لأنها بطيئة"],a:0},

  ]);

/* ---- M11: التفاعلات في المحاليل المائية على مستوى الجسيمات (الدرس 4-3) ---- */
function mIons(el){
  const SYS={ag:{n:"AgNO₃ + NaCl",A:[["Ag⁺","#b9c0cc"],["NO₃⁻","#4D95FF"]],B:[["Na⁺","#A280FF"],["Cl⁻","#57C785"]],pair:["Ag⁺","Cl⁻"],prod:"AgCl(s)",pc:"#f4f4f4",spec:["Na⁺","NO₃⁻"],
      eq:["AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)","Ag⁺ + NO₃⁻ + Na⁺ + Cl⁻ → AgCl(s) + Na⁺ + NO₃⁻","Ag⁺(aq) + Cl⁻(aq) → AgCl(s)"]},
    hw:{n:"HCl + NaOH",A:[["H⁺","#FF8080"],["Cl⁻","#57C785"]],B:[["Na⁺","#A280FF"],["OH⁻","#FFB547"]],pair:["H⁺","OH⁻"],prod:"H₂O",pc:"#8FD8FF",spec:["Na⁺","Cl⁻"],
      eq:["HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)","H⁺ + Cl⁻ + Na⁺ + OH⁻ → Na⁺ + Cl⁻ + H₂O(l)","H⁺(aq) + OH⁻(aq) → H₂O(l)"]}};
  let sys="ag", mixed=false, hide=false, I=[], P=[];
  const init=()=>{ I=[]; P=[]; mixed=false; const s=SYS[sys]; [s.A,s.B].forEach((pair,side)=>pair.forEach(([n,c])=>{ for(let i=0;i<6;i++) I.push({n,c,side,x:rnd(.1,.9),y:rnd(.2,.9),vx:rnd(-.2,.2),vy:rnd(-.2,.2),gone:false}); })); };
  el.innerHTML=modelShell(`<div class="card stack" style="gap:12px">${seg("ioS",Object.keys(SYS).map(k=>[k,SYS[k].n]),sys)}
    <div class="row"><button class="btn pri" id="ioMix">اخلطي المحلولين</button><button class="btn ghost" id="ioR">↺</button></div>
    <button class="btn sm" id="ioH">إخفاء الأيونات المتفرجة: لا</button>
    <div class="stack" style="gap:6px" id="ioEq"></div></div>`);
  const eqs=()=>{ const s=SYS[sys]; $("#ioEq").innerHTML=[["المعادلة الكيميائية",0],["المعادلة الأيونية الكاملة",1],["المعادلة الأيونية النهائية",2]].map(([t,i])=>`<div class="note ${i===2?"g":"i"} small"><b>${t}</b><div style="direction:ltr;text-align:left;font-family:var(--mono);margin-top:4px">${s.eq[i]}</div></div>`).join("")+`<div class="small muted">الأيونات المتفرجة: <b dir="ltr">${s.spec.join(" و ")}</b> — تبقى في المحلول دون تغيير.</div>`; };
  bindSeg("ioS",v=>{ sys=v; init(); eqs(); });
  $("#ioMix").onclick=()=>{ if(mixed) return; mixed=true; I.forEach(p=>{ p.x=p.side?rnd(.5,.95):rnd(.05,.5); }); };
  $("#ioR").onclick=()=>init(); $("#ioH").onclick=()=>{ hide=!hide; $("#ioH").textContent="إخفاء الأيونات المتفرجة: "+(hide?"نعم":"لا"); };
  init(); eqs();
  const svg=$("#ms");
  loopModel(dt=>{ const s=SYS[sys]; let v=stageBg();
    const box=mixed?[[200,90,400,300]]:[[70,110,300,270],[430,110,300,270]];
    box.forEach(([x,y,w,h])=>v+=`<path d="M${x} ${y} V${y+h} H${x+w} V${y}" fill="rgba(143,216,255,.22)" stroke="var(--glassware)" stroke-width="3"/>`);
    if(!mixed){ v+=tx(220,410,"محلول "+(sys==="ag"?"AgNO₃":"HCl"))+tx(580,410,"محلول NaOH".replace("NaOH",sys==="ag"?"NaCl":"NaOH")); }
    I.forEach(p=>{ if(p.gone) return; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx+=rnd(-.4,.4)*dt; p.vy+=rnd(-.4,.4)*dt; p.vx=clamp(p.vx,-.25,.25); p.vy=clamp(p.vy,-.25,.25); if(p.x<.04||p.x>.96) p.vx*=-1; if(p.y<.08||p.y>.96) p.vy*=-1; p.x=clamp(p.x,.04,.96); p.y=clamp(p.y,.08,.96); });
    if(mixed){ const [a,b]=s.pair; I.filter(p=>!p.gone&&p.n===a).forEach(p=>{ const q=I.find(o=>!o.gone&&o.n===b&&Math.hypot(o.x-p.x,(o.y-p.y)*.75)<.09); if(q){ p.gone=q.gone=true; P.push({x:(p.x+q.x)/2,y:(p.y+q.y)/2,vy:0}); } });
      P.forEach(o=>{ if(sys==="ag"){ o.y=Math.min(.94,o.y+dt*.12); } else { o.x+=rnd(-.1,.1)*dt; o.y+=rnd(-.1,.1)*dt; o.x=clamp(o.x,.05,.95); o.y=clamp(o.y,.1,.95); } }); }
    const pos=p=>{ const [x,y,w,h]=mixed?box[0]:box[p.side]; return [x+p.x*w, y+p.y*h]; };
    I.forEach(p=>{ if(p.gone) return; if(hide&&s.spec.includes(p.n)) return; const [x,y]=pos(p); v+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="${p.c}" stroke="#fff" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" direction="ltr" style="font:700 9px var(--mono);fill:#1E2257">${p.n}</text>`; });
    P.forEach(o=>{ const [x,y,w,h]=box[0]; const X=x+o.x*w, Y=y+o.y*h; v+=sys==="ag"?`<rect x="${X-12}" y="${Y-10}" width="24" height="20" rx="4" fill="${s.pc}" stroke="#9aa6bd"/><text x="${X}" y="${Y+4}" text-anchor="middle" direction="ltr" style="font:700 8px var(--mono);fill:#333">AgCl</text>`:`${atom(X,Y,11,"#FF4D6D","O")}${atom(X-12,Y+9,6,"#EEF4FF")}${atom(X+12,Y+9,6,"#EEF4FF")}`; });
    if(mixed) v+=tx(400,420,sys==="ag"?`تكوّن راسب AgCl (${P.length}) ويستقر في القاع`:`تكوّنت جزيئات ماء (${P.length})`,"fill:#4F29B6");
    svg.innerHTML=v; });
  mQuiz($("#mquiz"),[
    {q:"ما الأيونات المتفرجة في تفاعل AgNO₃ مع NaCl؟",o:["Na⁺ و NO₃⁻","Ag⁺ و Cl⁻","جميع الأيونات"],a:0,why:"تبقى حرة في المحلول قبل التفاعل وبعده."},
    {q:"ما المعادلة الأيونية النهائية لتفاعل HCl مع NaOH؟",o:["H⁺ + OH⁻ → H₂O","Na⁺ + Cl⁻ → NaCl","HCl + NaOH → NaCl + H₂O"],a:0},
    {q:"لماذا لا تُكتب الأيونات المتفرجة في المعادلة الأيونية النهائية؟",o:["لأنها لا تشارك في التفاعل وتبقى كما هي","لأنها تتبخر","لأنها تترسب"],a:0},
  ]);
}

/* ---- M12: الكتلة المولية للمركبات (الدرس 5-3) ---- */
function mMolar(el){
  const AM={H:[1.008,"#EEF4FF"],C:[12.01,"#3E4452"],O:[16.00,"#FF4D6D"],Na:[22.99,"#9B51E0"],Cl:[35.45,"#2EE59D"],Ca:[40.08,"#cfd8e6"],K:[39.10,"#B07AFF"],Mg:[24.31,"#b9c0cc"],Br:[79.90,"#A0522D"],N:[14.01,"#4D95FF"]};
  const CMP=[["H₂O",{H:2,O:1}],["CO₂",{C:1,O:2}],["NaCl",{Na:1,Cl:1}],["CaCO₃",{Ca:1,C:1,O:3}],["MgBr₂",{Mg:1,Br:2}],["K₂C₂O₄",{K:2,C:2,O:4}],["C₆H₁₂O₆",{C:6,H:12,O:6}],["NH₃",{N:1,H:3}]];
  let ci=0, hideT=false;
  el.innerHTML=modelShell(`<div class="card stack" style="gap:12px"><div class="row" style="gap:6px">${CMP.map(([f],i)=>`<button class="btn sm" data-c="${i}" dir="ltr">${f}</button>`).join("")}</div>
    <button class="btn sm ghost" id="mmH">وضع التحدي: إخفاء المجموع</button>
    <div class="tbl"><table><thead><tr><th>العنصر</th><th>عدد الذرات</th><th>الكتلة الذرية</th><th>المساهمة (g)</th></tr></thead><tbody id="mmT"></tbody></table></div>
    <div class="stat" style="padding:12px 16px"><span>الكتلة المولية</span><b id="mmM"></b></div>
    <div id="mmCh"></div></div>`);
  const M=()=>Object.entries(CMP[ci][1]).reduce((s,[e,n])=>s+AM[e][0]*n,0);
  function ui(){ const c=CMP[ci]; $("#mmT").innerHTML=Object.entries(c[1]).map(([e,n])=>`<tr><td><b>${e}</b></td><td class="n">${n}</td><td class="n">${AM[e][0]}</td><td class="n">${hideT?"؟":(AM[e][0]*n).toFixed(2)}</td></tr>`).join("");
    $("#mmM").textContent=hideT?"؟ g/mol":M().toFixed(2)+" g/mol";
    $("#mmCh").innerHTML=hideT?`<div class="row"><input class="inp" id="mmIn" inputmode="decimal" placeholder="اكتبي الكتلة المولية" style="max-width:180px;direction:ltr;text-align:left;font-family:var(--mono)"><button class="btn sm pri" id="mmC">✓ تحققي</button><span id="mmR" class="small"></span></div>`:"";
    const b=$("#mmC"); if(b) b.onclick=()=>{ const n=numIn($("#mmIn").value); const ok=Math.abs(n-M())<=.1; $("#mmR").innerHTML=ok?`<span class="verdict ok">✔ صحيح: ${M().toFixed(2)} g/mol</span>`:`<span class="verdict no">✘ اجمعي (عدد الذرات × الكتلة الذرية) لكل عنصر</span>`; }; }
  $$("button[data-c]",el).forEach(b=>b.onclick=()=>{ ci=+b.dataset.c; ui(); });
  $("#mmH").onclick=()=>{ hideT=!hideT; $("#mmH").textContent=hideT?"إظهار المجموع":"وضع التحدي: إخفاء المجموع"; ui(); };
  ui(); const svg=$("#ms"); let T=0;
  loopModel(dt=>{ T+=dt; const c=CMP[ci], tot=M(); let v=stageBg();
    v+=`<text x="400" y="50" text-anchor="middle" direction="ltr" style="font:800 34px var(--mono);fill:#4F29B6">${c[0]}</text>`;
    const atomsL=[]; Object.entries(c[1]).forEach(([e,n])=>{ for(let i=0;i<n;i++) atomsL.push(e); });
    const N=atomsL.length, cols=Math.min(8,N); atomsL.forEach((e,i)=>{ const r=Math.max(16,Math.min(34,12+Math.sqrt(AM[e][0])*2.4)); const x=400-(cols-1)*36+(i%cols)*72, y=125+Math.floor(i/cols)*70+Math.sin(T*2+i)*2; v+=atom(x,y,r,AM[e][1],e); });
    // stacked bar
    const bx=100,bw=600,by=300; let x=bx; v+=tx(400,by-14,"مساهمة كل عنصر في الكتلة المولية");
    Object.entries(c[1]).forEach(([e,n])=>{ const w=AM[e][0]*n/tot*bw; v+=`<rect x="${x}" y="${by}" width="${w}" height="44" fill="${AM[e][1]}" stroke="#fff"/>`; if(w>40) v+=`<text x="${x+w/2}" y="${by+27}" text-anchor="middle" direction="ltr" style="font:700 12px var(--mono);fill:#1E2257">${e} ${(AM[e][0]*n/tot*100).toFixed(0)}%</text>`; x+=w; });
    v+=`<rect x="${bx}" y="${by}" width="${bw}" height="44" fill="none" stroke="var(--glassware)" stroke-width="2"/>`;
    v+=disp(270,370,260,"كتلة 1 mol من "+c[0].replace(/<[^>]+>/g,""),hideT?"؟ g":tot.toFixed(2)+" g","#FFDA5E",26);
    svg.innerHTML=v; });
  mQuiz($("#mquiz"),[
    {q:"احسبي الكتلة المولية لكربونات الكالسيوم CaCO₃.<br><span class=\"muted small\">الكتل الذرية: Ca = 40.08 · C = 12.01 · O = 16.00</span>",ans:100.09,abs:.1,unit:"g/mol",hint:"40.08 + 12.01 + 3 × 16.00"},
    {q:"كم مولًا في 36.04 g من الماء؟",ans:2,abs:.01,unit:"mol",hint:"اقسمي الكتلة على الكتلة المولية للماء 18.02 g/mol."},
    {q:"الكتلة المولية للمركب تساوي…",o:["مجموع كتل الذرات في صيغته بوحدة g/mol","كتلة أثقل ذرة فيه","عدد الذرات في صيغته"],a:0},
  ]);
}

);
({m1:"الأوزون",m2:"حالات المادة",m3:"بنّاء الذرة",m4:"موازنة المعادلات",m5:"محوّل المول"}); MODELS.forEach(m=>{ if(!m.tab) m.tab=({m1:"الأوزون",m2:"حالات المادة",m3:"بنّاء الذرة",m4:"موازنة المعادلات",m5:"محوّل المول"})[m.id]; });

<script>
/* =================== student: إنجازي =================== */
const STAT_AR={new:"لم يبدأ",draft:"مسودة",submitted:"أُرسل",graded:"قُيّم",preview:"—"};
function vMe(m){
  const sid=App.s.sid, s=Store.st(sid), pr=D.prog[sid]||{}, bd=D.badges[sid]||{};
  const done=EXPS.filter(e=>pr[e.id]?.done).length, sub=EXPS.filter(e=>["submitted","graded"].includes(pr[e.id]?.status)).length, drafts=EXPS.filter(e=>pr[e.id]?.status==="draft").length;
  const grades=EXPS.map(e=>pr[e.id]).filter(p=>p?.status==="graded").map(p=>p.grade);
  m.innerHTML=`<div class="stack" style="gap:20px">
    <div class="row" style="justify-content:space-between;align-items:flex-end"><div class="stack" style="gap:4px"><span class="tag" style="align-self:flex-start">إنجازي · ${s.cls}</span><h1 style="font-size:clamp(28px,4.5vw,42px);font-weight:900">أهلًا ${esc(s.name)}</h1></div><button class="btn pri" data-go="ch:${(CHAPTERS.find(c=>EXPS.some(e=>e.ch===c.id&&!pr[e.id]?.done))||CHAPTERS[0]).id}">تابعي التجارب</button></div>
    ${window.Remote&&Remote.on?"":`<div class="note i row" style="justify-content:space-between;gap:10px"><span class="small">📤 في نهاية الحصة أرسلي ملف تقدمك إلى معلمتك (عبر منصة مدرستي أو البريد) لتظهر إحصاءاتك وتقاريرك في لوحتها.</span><button class="btn sm pur" id="expMe">📤 تنزيل ملف تقدمي</button></div>`}
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
      <div class="stat"><span>التجارب المكتملة</span><b>${done}/${EXPS.length}</b></div><div class="stat"><span>المسودات المحفوظة</span><b>${drafts}</b></div>
      <div class="stat"><span>التقارير المرسلة</span><b>${sub}</b></div><div class="stat"><span>مرات دخولي</span><b>${actOf(sid).logins}</b></div><div class="stat"><span>مرات تطبيق التجارب</span><b>${actOf(sid).expN}</b></div><div class="stat"><span>النماذج التي استكشفتها</span><b>${actOf(sid).modD}/${MODELS.length}</b></div><div class="stat"><span>متوسط تقييم المعلمة</span><b>${grades.length?(grades.reduce((a,b)=>a+b,0)/grades.length).toFixed(1)+"/10":"—"}</b></div></div>
    <div class="card stack"><b style="font-size:18px">الشارات والإنجازات</b><div class="badges">${BADGES.map(b=>`<div class="bdg ${bd[b.id]?"":"off"}"><span class="ic">${b.ic}</span><b>${b.name}</b><small>${b.desc}</small></div>`).join("")}</div></div>
    <div class="card stack"><b style="font-size:18px">تجاربي وتقاريري</b><div class="tbl"><table><thead><tr><th>الفصل</th><th>التجربة</th><th>الإنجاز</th><th>التقرير</th><th>تقييم المعلمة</th><th>محاولات</th><th></th></tr></thead><tbody>
      ${EXPS.map(e=>{ const p=pr[e.id]||{}; const c=CHAPTERS.find(x=>x.id===e.ch); return `<tr><td>${c.short}</td><td><b>${e.title}</b><div class="muted xs">${e.kind==="launch"?"تجربة استهلالية":e.kind==="mini"?"تجربة عملية":"مختبر الكيمياء"} · ص ${e.page}</div></td><td>${p.done?'<span class="tag">✓ مكتملة</span>':(p.steps||[]).length?'<span class="tag a">قيد التنفيذ</span>':'<span class="tag m">لم تبدأ</span>'}</td><td>${STAT_AR[p.status||"new"]}</td><td>${p.status==="graded"?`<b class="mono">${p.grade}/10</b>${p.comment?`<div class="muted xs" style="white-space:normal;max-width:240px">${esc(p.comment)}</div>`:""}`:"—"}</td><td class="n">${(p.tries||0)+((p.steps||[]).length?1:0)}</td><td><button class="btn sm ghost" data-open="${e.id}">فتح</button></td></tr>`; }).join("")}

  if($("#expMe")) $("#expMe").onclick=async()=>{ const ok=await saveFile(`تقدم-${s.name.split(" ").slice(0,2).join("-")}-${s.cls}.json`,JSON.stringify(exportPack([sid]))); if(ok) toast("نُزّل ملف تقدمك، أرسليه لمعلمتك"); };

/* =================== sync between devices (export / import files) =================== */
function exportPack(ids){ const pack={kind:"lulab-export",v:1,device:Store.dev(),at:Date.now(),students:{}};
  ids.forEach(id=>{ if(!D.students[id]) return; pack.students[id]={student:D.students[id],prog:D.prog[id]||{},stats:(D.stats||{})[id]||null,badges:D.badges[id]||{}}; }); return pack; }
async function saveFile(name,data){ const dl=await getDL(); if(!dl){ toast("التنزيل غير متاح في هذا العرض","w"); return false; }
  try{ await dl.save({filename:name,data}); return true; }catch(e){ if(e?.code!=="declined") toast("تعذر التنزيل","w"); return false; } }
const RANK={new:0,draft:1,submitted:2,graded:3};
function importPack(pack){ if(!pack||pack.kind!=="lulab-export") throw new Error("bad"); let n=0; const me=Store.dev();
  Object.entries(pack.students||{}).forEach(([id,x])=>{ n++;
    if(!D.students[id]) D.students[id]=x.student; D.prog[id]=D.prog[id]||{}; D.badges[id]=D.badges[id]||{};
    Object.entries(x.prog||{}).forEach(([eid,p])=>{ const L=D.prog[id][eid]; if(!L){ D.prog[id][eid]=p; return; }
      if(L.status==="graded") return; const a=RANK[p.status]||0, b=RANK[L.status]||0; if(a>b||(a===b&&(p.submittedAt||p.doneAt||0)>(L.submittedAt||L.doneAt||0))) D.prog[id][eid]=p; else if(p.done&&!L.done){ L.done=true; L.doneAt=p.doneAt; } });
    Object.entries(x.badges||{}).forEach(([b,t])=>{ if(!D.badges[id][b]) D.badges[id][b]=t; });
    if(x.stats&&pack.device!==me){ D.ext=D.ext||{}; D.ext[id]=D.ext[id]||{}; D.ext[id][pack.device]={stats:x.stats,at:pack.at}; } });
  Store.save(); return n; }

/* =================== activity =================== */
function actOf(id){ const S=statsOf(id); const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);

    if(!Object.keys(pack).length){ msg("لا توجد بيانات على هذا الجهاز."); return; }
    msg("جارٍ الرفع…"); try{ const r=await Remote.rpc("lab_admin_import",{p:pack},true); msg(`✓ رُفعت بيانات ${r.students} طالبة إلى قاعدة البيانات.`); Remote.ensureAll(true); }catch(e){ msg("تعذّر الرفع: "+e.message); } };
  const mg=$("#adMig"); if(mg) mg.onclick=()=>adminForm("نقل البيانات من خادم Google",`<label class="f" for="afg">رمز المعلمة على خادم Google<input class="inp" id="afg" type="password" dir="ltr"></label><span class="muted xs">تُنقل كل التقارير والدرجات والإحصاءات القديمة إلى قاعدة البيانات الجديدة، ولا يُحذف شيء من Google.</span>`,async()=>{
    const code=$("#afg").value.trim().toUpperCase();
    const r=await new Promise((res,rej)=>google.script.run.withSuccessHandler(x=>{ try{ res(typeof x==="string"?JSON.parse(x):x); }catch(e){ rej(e); } }).withFailureHandler(rej).api("all",JSON.stringify({code})));
    if(r.error) return r.error==="code"?"الرمز غير صحيح.":"تعذّر الاتصال بخادم Google.";
    const pack={}; Object.entries(r.recs||{}).forEach(([sid,x])=>{ if(x.rec) pack[sid]={prog:x.rec.prog||{},badges:x.rec.badges||{},devs:x.rec.devs||{}}; });
    const o=await Remote.rpc("lab_admin_import",{p:pack},true); toast(`نُقلت بيانات ${o.students} طالبة ✓`,"b"); });
}
</script>
