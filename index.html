<title>مختبر اللوتيتيوم الافتراضي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ===== Tuwaiq identity: blue 75% · violet 20% · ink 5% — with the guide's secondary colours used sparingly ===== */
:root{color-scheme:light}
html,body{background:#F0F9FF}
html:has(#app.night),body:has(#app.night){background:#241257}
#app{
  --bg:#F0F9FF; --bg2:#FFFFFF; --glass:rgba(255,255,255,.82); --glass2:#FFFFFF; --line:rgba(77,149,255,.22); --line2:rgba(79,41,182,.22);
  --ink:#262626; --body:#3B4658; --muted:#6B7890;
  --blue:#4D95FF; --cyan:#3A7FEA; --mint:#57E2D7; --purple:#4F29B6; --purple2:#A280FF; --amber:#D9822B; --cobalt:#4D95FF; --pink:#E05A5A; --good:#3BA55C;
  --t1:#5C9EFF; --t2:#82B4FF; --t3:#A6CAFF; --t4:#CADFFF; --t5:#E4EFFF;
  --cyan-soft:rgba(77,149,255,.11); --purple-soft:rgba(79,41,182,.08); --amber-soft:rgba(243,165,100,.15); --pink-soft:rgba(255,128,128,.14);
  --glow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 40px -24px rgba(47,111,214,.55);
  --display:"Cairo","IBM Plex Sans Arabic",Tahoma,sans-serif; --bodyf:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:20px; --glassware:#3A7FEA; --wall1:#F8FBFF; --wall2:#E4EFFF; --top1:#CADFFF; --top2:#A6CAFF; --gridc:rgba(77,149,255,.10);
  color-scheme:light; position:relative; isolation:isolate;
  min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--bodyf); font-size:16px; line-height:1.75; direction:rtl;
}
#app.night{
  --bg:#241257; --bg2:#2F1A6E; --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.1); --line:rgba(201,182,255,.24); --line2:rgba(201,182,255,.4);
  --ink:#F7F3FF; --body:#E2D9FF; --muted:#B3A6DA; --cyan:#A6CAFF; --purple:#C9B6FF; --purple2:#D9CCFF; --amber:#F3A564; --pink:#FF8080; --good:#80D782;
  --cyan-soft:rgba(166,202,255,.12); --purple-soft:rgba(201,182,255,.14); --amber-soft:rgba(243,165,100,.14); --pink-soft:rgba(255,128,128,.14);
  --glow:0 0 0 1px rgba(201,182,255,.18),0 18px 40px -22px rgba(162,128,255,.7); --glassware:#CADFFF; --wall1:#33197A; --wall2:#27125F; --top1:#5234AE; --top2:#40259A; --gridc:rgba(201,182,255,.09);
  color-scheme:dark; background:linear-gradient(165deg,#2C1670 0%,#1F0E4E 55%,#2E1878 100%) fixed;
}
#app.night #bgart circle[filter]{fill:#7B4FE8;opacity:.35}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple2);outline-offset:2px;border-radius:8px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:var(--mono)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:12.5px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:18px;position:relative;z-index:1}
@media(max-width:520px){.wrap{padding-inline:16px}}

/* ===== ambient lab background ===== */
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgart svg{width:100%;height:100%;display:block}
#bgart .mol{animation:drift 26s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
#bgart .orb{animation:spin 60s linear infinite;transform-origin:0 0}
#app.night #bgart{opacity:.55}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-10px) rotate(6deg)}}
@keyframes bb{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-160px);opacity:0}}

/* ===== top bar ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(240,249,255,.8);backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
#app.night .top{background:rgba(38,19,92,.85)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:66px}
.tuw{height:34px;width:auto;display:block;margin-inline-start:4px;padding-inline-start:12px;border-inline-start:1px solid var(--line)}
#app.night .tuw{filter:brightness(0) invert(1);opacity:.92}
@media(max-width:600px){.tuw{height:26px;padding-inline-start:8px}}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);text-align:right}
.brand b{font-family:var(--display);font-weight:900;font-size:17px;display:block;line-height:1.1}
.brand small{font-family:var(--mono);font-size:10.5px;color:var(--cyan);letter-spacing:.08em}
.lu{width:42px;height:42px;border-radius:12px;flex:none;position:relative;background:#4F29B6;direction:ltr;color:#fff;box-shadow:0 8px 18px -8px rgba(79,41,182,.7)}
.lu i{position:absolute;top:4px;left:6px;font:600 8px var(--mono);font-style:normal;opacity:.85}
.lu em{position:absolute;bottom:4px;left:6px;font:800 18px/1 var(--display);font-style:normal}
.lu s{position:absolute;width:7px;height:7px;border-radius:2px;background:#57E2D7;right:5px;top:6px}
.lu s+s{background:#4D95FF;right:12px;top:13px}
.navx{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navx::-webkit-scrollbar{display:none}
.navx button{flex:none;border:0;background:none;border-radius:999px;padding:7px 14px;color:var(--muted);font-weight:600;white-space:nowrap}
.navx button:hover{color:var(--ink);background:var(--cyan-soft)}
.navx button[aria-current="page"]{color:#fff;background:var(--blue)}
.who{display:flex;gap:8px;align-items:center;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--glass2);border-radius:10px;padding:6px 10px;color:var(--body);font-size:13px}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-family:var(--display);background:var(--purple);color:#fff}
@media(max-width:1440px){.navx button{padding:7px 9px;font-size:15px}.who .nm .muted{display:none}.top .wrap{gap:10px}}
@media(max-width:700px){.brand small,.who .nm{display:none}}

/* ===== generic ===== */
main{padding-block:28px 80px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(10px);box-shadow:0 12px 30px -26px rgba(47,111,214,.6)}
.card.hl{box-shadow:var(--glow);border-color:rgba(77,149,255,.45)}
.eyebrow{font-size:13px;color:var(--cyan);font-weight:700}
.tag{width:fit-content;display:inline-flex;align-items:center;gap:6px;color:var(--cyan);background:var(--cyan-soft);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;border:1px solid transparent}
.tag.p{color:var(--purple);background:var(--purple-soft)}
.tag.a{color:var(--amber);background:var(--amber-soft)}
.tag.k{color:var(--pink);background:var(--pink-soft)}
.tag.m{color:var(--muted);background:transparent;border-color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:9px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--glass2);color:var(--ink);transition:transform .12s,box-shadow .2s,background .15s;line-height:1.3}
.btn:hover{border-color:var(--blue);box-shadow:0 10px 22px -14px rgba(47,111,214,.8)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,#5C9EFF,#3A7FEA);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(58,127,234,.9)}
.btn.pur{background:#4F29B6;color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(79,41,182,.8)}
.btn.ghost{background:transparent;color:var(--body)}
.btn.wht{background:#fff;color:#4F29B6;border-color:transparent}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.inp{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--cyan-soft)}
textarea.inp{min-height:78px;resize:vertical;line-height:1.7}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14.5px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:6px 14px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;max-height:320px;overflow:auto;padding:2px}
.namegrid .nm{display:flex;gap:8px;align-items:center;text-align:right;border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:8px 10px;font-weight:600;color:var(--ink);font-size:14px}
.namegrid .nm span{font-size:11px;color:var(--muted);min-width:18px}
.namegrid .nm:hover{border-color:var(--blue)}
.namegrid .nm.on{background:var(--blue);color:#fff;border-color:var(--blue)}.namegrid .nm.on span{color:#E4EFFF}
.note{border-radius:14px;padding:12px 14px;font-size:14.5px;border:1px solid}
.note.i{background:var(--cyan-soft);border-color:var(--line)}
.note.w{background:var(--amber-soft);border-color:rgba(243,165,100,.45)}
.note.k{background:var(--pink-soft);border-color:rgba(255,128,128,.45)}
.note.g{background:rgba(128,215,130,.16);border-color:rgba(59,165,92,.4)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:13px;background:var(--cyan-soft)}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--mono);direction:ltr;text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--cyan-soft)}
.idcard{display:flex;align-items:center;gap:16px;background:var(--glass2);border:1px solid var(--line);border-radius:18px;padding:10px 16px;width:fit-content;max-width:100%;flex-wrap:wrap;box-shadow:0 14px 30px -24px rgba(47,111,214,.7)}
.plate{background:#fff;border-radius:10px;padding:8px 12px;display:flex;align-items:center}
.plate img{width:190px;max-width:100%;height:auto;display:block}
.flogo{display:flex;align-items:center}.flogo img{display:block;height:auto;max-width:100%}
#app.night .flogo img{filter:brightness(0) invert(1);opacity:.9}
.idcard small{display:block;color:var(--muted);font-size:13px}
.idcard b{font-family:var(--display);font-size:19px}
.idcard.big{padding:0;gap:14px;border:0;background:none;box-shadow:none;align-items:center}
.byline .avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font:800 20px var(--display);color:#fff;background:linear-gradient(135deg,#4F29B6,#4D95FF);box-shadow:0 8px 16px -10px rgba(79,41,182,.8)}
.byline .tname{display:block;font:800 20px/1.4 var(--display);letter-spacing:.2px;background:linear-gradient(90deg,#4F29B6,#4D95FF);-webkit-background-clip:text;background-clip:text;color:transparent}
#app.night .byline .tname{background:linear-gradient(90deg,#D9CCFF,#A6CAFF);-webkit-background-clip:text;background-clip:text}
.idcard.big small{font-size:12.5px}
.idcard.logos .plate{background:none;padding:0}
.idcard.logos .plate img{width:170px}
.herofoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding-top:18px;margin-top:6px;border-top:1px solid var(--line)}
.byline{display:flex;flex-direction:column;gap:0}
.byline small{display:block;color:var(--muted);font-size:12.5px;line-height:1.6}
.plate.logos{background:none;padding:0;margin-inline-start:auto}.plate.logos img{width:180px}
#app.night .plate.logos{background:#fff;border-radius:12px;padding:6px 10px}
#app.night .idcard.logos .plate{background:#fff;border-radius:12px;padding:6px 10px}

/* ===== hero ===== */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center;padding-block:14px 26px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(32px,4.6vw,54px);font-weight:900;line-height:1.3;color:var(--ink)}
.brandline{display:flex;align-items:center;gap:12px}
.brandline b{display:block;font:800 22px/1.3 var(--display);color:var(--purple)}
.brandline small{display:block;font:600 13px var(--mono);letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;direction:ltr;text-align:right}
#app.night .brandline b{color:#C9B6FF}
.lu.big{width:56px;height:56px;border-radius:15px}.lu.big i{font-size:10px;top:6px;left:8px}.lu.big em{font-size:24px;bottom:6px;left:8px}
.btn.cta{font-size:17px;padding:13px 24px;box-shadow:0 16px 30px -14px rgba(77,149,255,.9)}
.welcome{max-width:860px;margin:10px auto 0;border-radius:28px;overflow:hidden;background:var(--glass);border:1px solid var(--line);box-shadow:0 40px 80px -50px rgba(47,111,214,.8);backdrop-filter:blur(8px)}
.welcome .wtop{display:flex;gap:18px;align-items:center;padding:28px 30px;color:#fff;background:linear-gradient(120deg,#4F29B6 0%,#4D95FF 100%);position:relative;overflow:hidden}
.welcome .wtop::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(87,226,215,.45),transparent 70%)}
.welcome .wtop .lu{background:#fff;color:#4F29B6}.welcome .wtop .lu s{background:#57E2D7}
.welcome .wtop h1{font-size:clamp(24px,3.4vw,34px);color:#fff;line-height:1.35}
.welcome .wtop p{margin:4px 0 0;font-size:18px;color:#E4EFFF;font-weight:600}
.welcome .wbody{padding:26px 30px;display:grid;gap:14px;font-size:17px;line-height:1.95;color:var(--body)}
.welcome .wbody p{margin:0}
.welcome .spark{font:800 20px var(--display);color:var(--purple)}
#app.night .welcome .spark{color:#C9B6FF}
.safety{border-radius:18px;padding:16px 18px;background:var(--cyan-soft);border:1px dashed var(--blue)}
.safety .sic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#FFDA5E;font-size:20px}
.safety ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.safety li{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:15.5px;color:var(--ink)}
@media(max-width:600px){.welcome .wtop{flex-direction:column;align-items:flex-start;padding:22px 18px}.welcome .wbody{padding:20px 18px;font-size:16px}}
.hero h1 span{background:linear-gradient(90deg,#4F29B6,#4D95FF);-webkit-background-clip:text;background-clip:text;color:transparent}
#app.night .hero h1 span{background:linear-gradient(90deg,#A280FF,#82B4FF);-webkit-background-clip:text;background-clip:text}
.lede{font-size:18px;color:var(--body);max-width:58ch}
.honor{margin-top:30px;gap:16px;display:flex;flex-direction:column;background:linear-gradient(135deg,var(--glass2),var(--purple-soft))}
.honorgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:end}
@media(max-width:900px){.honorgrid{grid-template-columns:1fr}}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;min-height:250px}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pod .medal{font-size:34px;line-height:1}
.pod b{font-family:var(--display);font-size:16px;line-height:1.3}
.pod small{color:var(--muted);font-size:12px}
.pod .cnt{font-size:13px;color:var(--body)}.pod .cnt b{font:700 18px var(--mono);color:var(--purple)}
.pod .base{width:100%;border-radius:14px 14px 6px 6px;margin-top:6px;display:grid;place-items:center;color:#fff;font:900 28px var(--display)}
.pod.p1 .base{height:110px;background:linear-gradient(180deg,#4F29B6,#6A45CC)}
.pod.p2 .base{height:80px;background:linear-gradient(180deg,#4D95FF,#82B4FF)}
.pod.p3 .base{height:60px;background:linear-gradient(180deg,#57E2D7,#1FB5AA)}
.pod.empty{opacity:.55}
.rank{margin:0;padding:0;list-style:none;counter-reset:r 3;display:grid;gap:6px}
.rank li{counter-increment:r;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:7px 12px}
.rank li::before{content:counter(r);font:700 13px var(--mono);color:var(--muted);width:20px}
.rank li span{flex:1}.rank li b{font:700 16px var(--mono);color:var(--purple)}
.rank li.me{border-color:var(--purple);box-shadow:var(--glow)}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rw{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:1px dashed var(--line2);border-radius:14px;padding:10px 6px;opacity:.75}
.rw span{font-size:24px}.rw b{font-size:13px}.rw small{font-size:11.5px;color:var(--muted)}
.rw.on{opacity:1;border-style:solid;border-color:var(--purple);background:var(--purple-soft)}
.pin{max-width:180px;font:700 22px var(--mono);letter-spacing:.5em;text-align:center}
.clsrep{border:1px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--glass2)}
.clsrep summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;list-style:none;padding:4px 0}
.clsrep summary::-webkit-details-marker{display:none}
.clsrep summary b{font-family:var(--display);font-size:17px}
.clsrep[open] summary{margin-bottom:10px}
.syncchip{position:fixed;bottom:14px;inset-inline-end:14px;z-index:60;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;background:var(--glass2);border:1px solid var(--line);box-shadow:0 10px 24px -14px rgba(47,111,214,.7);backdrop-filter:blur(8px)}
.syncchip.ok{color:var(--good)}.syncchip.wait{color:var(--cyan)}.syncchip.bad{color:var(--amber)}
#printarea{display:none}
@media print{
  body.printing>*:not(#printarea){display:none!important}
  body.printing #printarea{display:block;direction:rtl;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:#18203a;line-height:1.8;padding:0 6mm}
  #printarea h1{font-size:22px;margin:0;color:#4F29B6} #printarea h2{font-size:16px;color:#3A7FEA;border-bottom:2px solid #E4EFFF;padding-bottom:3px;margin-top:16px}
  #printarea .hd{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:3px solid #4F29B6;padding-bottom:10px}
  #printarea .hd img{height:48px}
  #printarea .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:#F0F9FF;border-radius:10px;padding:10px 14px;margin-top:12px}
  #printarea table{border-collapse:collapse;width:100%} #printarea th,#printarea td{border:1px solid #d9dfeb;padding:5px 8px;text-align:right} #printarea th{background:#f1f4fa}
  #printarea .lu{display:inline-block;position:static;width:auto;height:auto;box-shadow:none;background:#4F29B6;color:#fff;font-weight:800;border-radius:8px;padding:2px 8px;direction:ltr;font-size:12px}
  html:has(body.printing),body.printing{background:#fff!important}
  @page{size:A4;margin:14mm}
}
.navbtns{display:flex;gap:6px;flex:none}.navbtns:empty{display:none}
@media(max-width:700px){.navbtns .iconbtn{padding:6px 9px;font-size:13px}}
.sign{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted);width:fit-content}
.sign b{font:800 17px var(--display);background:linear-gradient(90deg,#4F29B6,#4D95FF);-webkit-background-clip:text;background-clip:text;color:transparent;margin-inline-start:2px}
#app.night .sign b{background:linear-gradient(90deg,#D9CCFF,#A6CAFF);-webkit-background-clip:text;background-clip:text}
.sign .sl{width:26px;height:26px;flex:none;filter:drop-shadow(0 4px 6px rgba(79,41,182,.25))}
.sign .sd{width:1px;height:18px;background:var(--line2)}
.heroart{width:100%;max-width:560px;justify-self:center;filter:drop-shadow(0 30px 40px rgba(47,111,214,.28))}
.heroart .bub{animation:bb 9s linear infinite;transform-box:fill-box}
.heroart .flt{animation:fl 14s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.heroart .spin{animation:spin 80s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.chcard{text-align:right;border:1px solid var(--line);background:var(--glass2);border-radius:22px;padding:0;display:flex;flex-direction:column;color:var(--ink);transition:transform .18s,box-shadow .2s;overflow:hidden;box-shadow:0 14px 30px -26px rgba(47,111,214,.8)}
.chcard:hover{transform:translateY(-4px);box-shadow:0 26px 40px -24px rgba(47,111,214,.55)}
.chcard .art{height:118px;position:relative;background:var(--c);display:grid;place-items:center}
.chcard .art svg{height:96px;width:auto}
.chcard .art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 110%,rgba(255,255,255,.35),transparent 55%)}
.chcard .no{position:absolute;top:10px;right:14px;font:900 15px var(--mono);color:#fff;background:rgba(0,0,0,.14);border-radius:8px;padding:0 8px}
.chcard .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.chcard h3{font-size:18px}
.chcard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--body)}
.chcard ul li{display:flex;gap:6px}
.chcard ul li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--c);margin-top:9px}
.bar{height:6px;border-radius:6px;background:var(--t5);overflow:hidden}
#app.night .bar{background:rgba(255,255,255,.08)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4F29B6,#4D95FF);border-radius:6px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.feat .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.feat .ic svg{width:30px;height:30px}

/* ===== chapter & tabs ===== */
.chhead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.chhead h1{font-size:clamp(28px,4.5vw,44px);font-weight:900}
.chhead .chart{width:150px;height:110px;border-radius:24px;display:grid;place-items:center;background:var(--c)}
.chhead .chart svg{height:88px}
@media(max-width:640px){.chhead .chart{display:none}.chhead{grid-template-columns:1fr}}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:20;background:rgba(240,249,255,.86);backdrop-filter:blur(14px);padding-block:10px;margin-block:14px 18px;border-bottom:1px solid var(--line)}
#app.night .tabs{background:rgba(38,19,92,.9)}
.tabrow{display:flex;gap:8px;flex-wrap:wrap}
.tabrow::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:7px 16px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:#fff;border-color:transparent;background:#4F29B6;box-shadow:0 10px 20px -12px rgba(79,41,182,.9)}
.tab .ok{color:var(--good)}
.tab[aria-selected="true"] .ok{color:#80D782}

/* ===== experiment ===== */
.xhead{display:grid;gap:8px}
.xhead h2{font-size:clamp(24px,3.6vw,34px)}
.qbox{border-inline-start:5px solid #4F29B6;background:var(--glass2);border-radius:14px;padding:12px 16px;font-weight:600;box-shadow:0 12px 26px -22px rgba(79,41,182,.7)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media(max-width:1000px){.lab{grid-template-columns:1fr}}
.bench{position:relative;border-radius:24px;border:1px solid var(--line);background:var(--glass2);overflow:hidden;box-shadow:var(--glow)}
.bench svg.scene{display:block;width:100%;height:auto;touch-action:none}
.bench .sensors{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--glass)}
.sensor{flex:1 1 120px;border-radius:14px;padding:6px 12px;background:#1E2257;color:#fff}
.sensor span{display:block;font-size:12px;color:#A6CAFF}
.sensor b{font:600 20px var(--mono);color:#82F0E6;direction:ltr;display:block;text-align:right}
.sensor.a b{color:#FFDA5E} .sensor.p b{color:#C9B6FF}
.traybar{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--glass);display:grid;gap:8px}
.tray{display:flex;gap:8px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--t2);background:var(--glass2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;touch-action:none;user-select:none;cursor:grab;color:var(--ink);transition:transform .12s,box-shadow .15s}
.item:hover{transform:translateY(-2px);box-shadow:0 10px 18px -12px rgba(47,111,214,.8);border-style:solid}
.item svg{width:26px;height:26px;flex:none}
.item[aria-pressed="true"]{border-style:solid;border-color:#4F29B6;box-shadow:0 0 0 4px var(--purple-soft)}
.item.used{opacity:.35;cursor:default;transform:none;box-shadow:none}
.dragghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.06) rotate(-3deg);opacity:.95;box-shadow:0 18px 30px -12px rgba(47,111,214,.8)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;font-size:14.5px;color:var(--muted);padding:6px 8px;border-radius:12px}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:600 13px var(--mono);border:1px solid var(--line);color:var(--muted);background:var(--glass2)}
.steps li.cur{background:var(--purple-soft);color:var(--ink)}
.steps li.cur::before{border-color:#4F29B6;color:#fff;background:#4F29B6}
.steps li.done{color:var(--body)}
.steps li.done::before{content:"✓";background:#80D782;border-color:#80D782;color:#123a1c}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.fb{min-height:1.6em;font-size:14.5px}
.toast-area{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{border-radius:14px;padding:12px 16px;font-size:14.5px;background:#262169;color:#fff;box-shadow:0 18px 34px -14px rgba(38,33,105,.8);animation:tin .25s}
.toast.w{background:#8A4B12}
.toast.b{background:#4F29B6}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.qa{display:grid;gap:10px}
.q{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--glass2);display:grid;gap:10px}
.q .qt{font-weight:700}
.q .qt b{color:var(--purple)}
.opts{display:grid;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--bg2);border-radius:12px;padding:8px 12px;text-align:right;color:var(--ink);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--purple);background:var(--purple-soft)}
.opt.right{border-color:#3BA55C;background:rgba(128,215,130,.18)}
.opt.wrong{border-color:#E05A5A;background:var(--pink-soft)}
.why{font-size:14px;color:var(--body)}
.chkrow{gap:8px;align-items:center}
.verdict{font-weight:700;font-size:14.5px}.verdict.ok{color:var(--good)}.verdict.no{color:var(--pink)}
.verdict .hint{display:block;font-weight:500;color:var(--body);margin-top:4px}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.idea{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.idea.y{background:rgba(128,215,130,.2);color:#2E7D46}.idea.n{background:var(--amber-soft);color:#9A5A12}
#app.night .idea.y{color:#9BE59D}#app.night .idea.n{color:#FFD08A}
.mans{border-inline-start:4px solid var(--purple);background:var(--purple-soft);border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.9;color:var(--ink)}
.score{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;background:linear-gradient(120deg,rgba(79,41,182,.1),rgba(77,149,255,.12));border:1px solid var(--line)}
.score span{font-weight:700;color:var(--purple)}#app.night .score span{color:#C9B6FF}
.score b{font:700 22px var(--mono);direction:ltr;color:var(--ink)}
details.rep{border:1.5px solid var(--line2);border-radius:22px;background:var(--glass2);overflow:hidden;box-shadow:0 18px 36px -28px rgba(79,41,182,.8)}
details.rep>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--purple-soft),transparent)}
details.rep>summary::-webkit-details-marker{display:none}
details.rep>summary::after{content:"＋";color:var(--purple);font-size:22px}
details.rep[open]>summary::after{content:"－"}
details.rep .in{padding:14px 18px 18px;display:grid;gap:14px}
.vars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:700px){.vars{grid-template-columns:1fr}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;display:grid;justify-items:center;gap:6px;background:var(--glass2)}
.bdg .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,#E4EFFF,#EDE7FF)}
.bdg b{font-family:var(--display);font-size:15px}
.bdg small{color:var(--muted);font-size:12.5px;line-height:1.5}
.bdg.off{opacity:.4;filter:grayscale(1)}
.stat{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--glass2)}
.stat span{font-size:13px;color:var(--muted);display:block}
.stat b{font:600 30px var(--mono);color:var(--cyan);direction:ltr;display:block;text-align:right}
.model{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.model{grid-template-columns:1fr}}
.stagebox{border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,var(--wall1),var(--wall2));overflow:hidden;box-shadow:var(--glow)}
.stagebox svg,.stagebox canvas{display:block;width:100%;height:auto}
input[type=range]{width:100%;accent-color:#4F29B6}
.rng{display:grid;gap:2px}
.rng .t{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.rng .t b{font-family:var(--mono);color:var(--cyan);direction:ltr}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--glass2)}
.stepper button{border:0;background:var(--cyan-soft);width:32px;height:32px;font-weight:800;color:var(--ink)}
.stepper b{min-width:34px;text-align:center;font-family:var(--mono)}
footer.site{border-top:1px solid var(--line);padding-block:20px;color:var(--muted);font-size:14px;position:relative;z-index:1;background:var(--glass)}
.modal-bg{position:fixed;inset:0;background:rgba(30,34,87,.45);backdrop-filter:blur(6px);z-index:90;overflow:auto;padding:30px 16px}
.modal{max-width:920px;margin:0 auto;background:var(--bg);border:1px solid var(--line2);border-radius:24px;padding:22px;box-shadow:0 30px 70px -30px rgba(38,33,105,.8)}
.repdoc{background:#fff;color:#1a2233;border-radius:14px;padding:22px;font-family:var(--bodyf);border:1px solid #E4EFFF}
.repdoc h3{color:#4F29B6}
.repdoc table th{background:#F0F9FF;color:#566}
.repdoc table td,.repdoc table th{border-bottom:1px solid #E4EFFF}

/* ===== svg scene ===== */
:is(.scene,.stagebox) .gl{fill:url(#gGlass);stroke:var(--glassware);stroke-width:2.2;stroke-linejoin:round}
:is(.scene,.stagebox) .gl2{fill:none;stroke:var(--glassware);stroke-width:2.2;stroke-linejoin:round}
:is(.scene,.stagebox) .lbl{fill:var(--muted);font:600 13px var(--bodyf)}
:is(.scene,.stagebox) .lbl2{fill:var(--ink);font:700 14px var(--bodyf)}
:is(.scene,.stagebox) .dlbl{fill:#A6CAFF;font:600 13px var(--bodyf)}
:is(.scene,.stagebox) .tick{stroke:var(--glassware);stroke-width:1.2;opacity:.7}
.scene .dz{fill:rgba(79,41,182,.05);stroke:#4F29B6;stroke-width:2;stroke-dasharray:7 6;opacity:0;transition:opacity .15s}
.scene.dragging .dz,.scene.armed .dz{opacity:1}
.scene .dz.hot{fill:rgba(79,41,182,.14);opacity:1}
.scene .clk{cursor:pointer}
:is(.scene,.stagebox) .walltop{stop-color:var(--wall1)} :is(.scene,.stagebox) .wallbot{stop-color:var(--wall2)}
:is(.scene,.stagebox) .bt1{stop-color:var(--top1)} :is(.scene,.stagebox) .bt2{stop-color:var(--top2)}
:is(.scene,.stagebox) .gridln{stroke:var(--gridc)}

const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;};
const fmtT=ts=>{ if(!ts) return "—"; const d=new Date(ts),p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function numIn(s){ s=String(s??"").trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,]/g,".").replace(/\s/g,"").replace(/[×x]10\^?/i,"e"); return s===""?NaN:Number(s); }
function toast(m,k){ const t=document.createElement("div"); t.className="toast"+(k?" "+k:""); t.textContent=m; $("#toasts").appendChild(t); setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity=0;setTimeout(()=>t.remove(),320);},k==="b"?4200:3200); }

/* ---------- storage (this device) ---------- */
const MEM={};
const LS={get(k){try{return localStorage.getItem(k)??MEM[k]??null}catch(e){return MEM[k]??null}},set(k,v){MEM[k]=v;try{localStorage.setItem(k,v)}catch(e){}},del(k){delete MEM[k];try{localStorage.removeItem(k)}catch(e){}}};
const KEY="lulab.v2", SKEY="lulab.v2.session";
let D;
const CLASSES=["G101","G102","G103"];
const ROSTER={};
const PINH={};
const fnv=s=>{ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,"0"); };
function applyRoster(){ let ch=false; if(!D.rosterV){ Object.keys(D.students).forEach(id=>{ if(D.students[id].demo){ delete D.students[id]; delete D.prog[id]; delete D.badges[id]; } }); D.rosterV=1; ch=true; }
  CLASSES.forEach(c=>(ROSTER[c]||[]).forEach((n,i)=>{ const id=`r_${c}_${i+1}`; if(D.students[id]&&D.students[id].name!==n){ D.students[id].name=n; ch=true; } if(!D.students[id]){ D.students[id]={name:n,cls:c,num:String(i+1),roster:true,created:Date.now()}; D.prog[id]=D.prog[id]||{}; D.badges[id]=D.badges[id]||{}; ch=true; } }));
  if(ch) Store.save(); }
const Store={
  load(){ try{ D=JSON.parse(LS.get(KEY)||"null"); }catch(e){ D=null; } if(!D||D.v!==2){ D={v:2,students:{},prog:{},badges:{},rosterV:1}; } applyRoster(); },
  save(){ LS.set(KEY,JSON.stringify(D)); },
  st(id){ return D.students[id]; },
  prog(sid,eid){ D.prog[sid]=D.prog[sid]||{}; return D.prog[sid][eid]=D.prog[sid][eid]||{steps:[],answers:{},report:{},status:"new",tries:0}; },
  stat(sid){ D.stats=D.stats||{}; return D.stats[sid]=D.stats[sid]||{logins:0,last:null,exp:{},done:{},mod:{}}; },
  dev(){ let d=LS.get("lulab.dev"); if(!d){ d="d"+Math.random().toString(36).slice(2,10); LS.set("lulab.dev",d); } return d; },
  hit(sid,kind,key){ if(!sid||!D.students[sid]) return; const S=Store.stat(sid); if(kind==="login"){ S.logins++; S.last=Date.now(); } else { S[kind][key]=(S[kind][key]||0)+1; } Store.save(); },
  award(sid,bid){ D.badges[sid]=D.badges[sid]||{}; if(D.badges[sid][bid]) return false; D.badges[sid][bid]=Date.now(); Store.save(); return true; }
};
const App={s:null,view:"home",param:null,cleanup:[]};
function loadSes(){ try{ const s=JSON.parse(LS.get(SKEY)||"null"); if(s&&(s.role==="teacher"||(s.role==="student"&&D.students[s.sid]))) App.s=s; }catch(e){} }
function setSes(s){ App.s=s; s?LS.set(SKEY,JSON.stringify(s)):LS.del(SKEY); }
const isStu=()=>App.s?.role==="student"&&!!D?.students?.[App.s.sid], isT=()=>App.s?.role==="teacher";

/* ---------- router ---------- */
App.hist=[];
function goBack(){ const h=App.hist.pop(); if(!h){ go("home",null,true); return; } if(h.tab) Object.assign(App.tab,h.tab); go(h.v,h.p,true); }
function go(v,p,nohist){ if(!nohist&&(App.view!==v||App.param!==(p??null))){ App.hist.push({v:App.view,p:App.param,tab:{...(App.tab||{})}}); if(App.hist.length>40) App.hist.shift(); } App.view=v; App.param=p??null; if(location.hash.slice(1)!==v){ App._q=true; location.hash=v; } render(); try{scrollTo({top:0})}catch(e){} }
addEventListener("hashchange",()=>{ if(App._q){App._q=false;return;} const v=location.hash.slice(1)||"home"; if(v!==App.view){App.view=v;App.param=null;render();} });
document.addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(!b) return; e.preventDefault(); const [v,p]=b.dataset.go.split(":"); go(v,p); });
function nav(){
  const items=isT()?[["teacher","لوحة المعلمة"],["home","الفصول"]]:isStu()?[["home","الفصول"],["me","إنجازي"]]:[["home","الفصول"],["login","الدخول"]];

App.hf="all";
/* merged activity: this device + imported devices */
function statsOf(id){ const out={logins:0,last:null,exp:{},done:{},mod:{}}; const add=S=>{ if(!S) return; out.logins+=S.logins||0; if(S.last&&(!out.last||S.last>out.last)) out.last=S.last; ["exp","done","mod"].forEach(k=>Object.entries(S[k]||{}).forEach(([x,v])=>out[k][x]=(out[k][x]||0)+v)); };
  add((D.stats||{})[id]); Object.values((D.ext||{})[id]||{}).forEach(e=>add(e.stats)); return out; }
function honorBoard(sid){ const st={}; Object.keys(D.students).forEach(id=>{ const m=statsOf(id); if(m.logins||Object.keys(m.exp).length||Object.keys(m.mod).length) st[id]=m; });
  const all=Object.keys(D.students).filter(id=>D.students[id].roster||st[id]).map(id=>({id,s:D.students[id],n:st[id]?.logins||0,act:Object.values(st[id]?.exp||{}).reduce((a,b)=>a+b,0)+Object.values(st[id]?.mod||{}).reduce((a,b)=>a+b,0)})).filter(x=>App.hf==="all"||x.s.cls===App.hf);
  const top=all.filter(x=>x.n>0).sort((a,b)=>b.n-a.n||b.act-a.act).slice(0,10);
  const nm=s=>esc(s.name.split(" ").slice(0,2).join(" "));

function vLogin(m){
  const t=App.param==="t";
  m.innerHTML=`<div class="stack" style="max-width:920px;margin:0 auto;gap:20px">

        <button class="btn pri" type="submit" id="fsb">ادخلي المختبر</button>

      <form class="card stack ${t?"hl":""}" id="ft" novalidate><h2 style="font-size:22px">دخول المعلمة</h2>
        <label class="f" for="tem">البريد الإلكتروني (حساب الأدمن)<input class="inp" id="tem" type="email" dir="ltr" autocomplete="username" placeholder="name@example.com"></label>
        <label class="f" for="tc">كلمة المرور<input class="inp" id="tc" type="password" dir="ltr" autocomplete="current-password"></label>
        <span class="muted small">البيانات لدى المعلمة فقط.</span>
        <span class="small" style="color:var(--pink)" id="te"></span>
        <button class="btn pur" type="submit">دخول المعلمة</button></form>
    </div></div>`;
  let cls=CLASSES[0], pick=null;
  const names=()=>{ const ids=Object.keys(D.students).filter(id=>D.students[id].roster&&D.students[id].cls===cls).sort((a,b)=>+D.students[a].num-+D.students[b].num);
    $("#ng").innerHTML=ids.map(id=>`<button type="button" class="nm ${pick===id?"on":""}" data-id="${id}"><span class="mono">${D.students[id].num}</span>${esc(D.students[id].name)}</button>`).join("")||`<span class="muted small">جارٍ تحميل الأسماء… إذا تأخرت تأكدي من الاتصال بالإنترنت ثم حدّثي الصفحة.</span>`;
    $$("#ng .nm").forEach(b=>b.onclick=()=>{ pick=b.dataset.id; $("#nm").value=""; names(); $("#fsb").textContent="ادخلي باسم: "+D.students[pick].name.split(" ")[0]; $("#pinw").hidden=false; $("#pin").value=""; $("#se").textContent=""; $("#pin").focus(); }); };
  $$("#cl button").forEach(b=>b.onclick=()=>{cls=b.dataset.c;pick=null;$$("#cl button").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#fsb").textContent="ادخلي المختبر";$("#pinw").hidden=true;names();});
  names();
  $("#fs").onsubmit=async e=>{ e.preventDefault(); const nm=$("#nm").value.trim(); let id=pick; const pinv=String($("#pin")?.value||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();
    if(!id){ if(nm.length<5){ $("#se").textContent="اختاري اسمك من القائمة، أو اكتبي اسمك الثلاثي."; return; } id="s_"+cls+"_"+nm.replace(/\s+/g,"_"); if(!D.students[id]) D.students[id]={name:nm,cls,num:"—",created:Date.now()}; Store.save(); }
    const bad=()=>{ $("#se").textContent="رمز الدخول غير صحيح. تأكدي من الرمز الذي أعطتك إياه المعلمة."; $("#pin").value=""; $("#pin").focus(); };
    let online=false;
    if(pick&&window.Remote&&Remote.on){ if(!/^\d{4}$/.test(pinv)){ bad(); return; } $("#se").textContent="جارٍ التحقق…"; $("#fsb").disabled=true; const r=await Remote.studentLogin(pick,pinv); $("#fsb").disabled=false; $("#se").textContent="";

    const n=D.students[id].name; setSes({role:"student",sid:id}); Store.hit(id,"login"); const LN=Store.stat(id).logins; [[5,"visit5"],[10,"visit10"],[20,"visit20"]].forEach(([k,b])=>{ if(LN>=k&&Store.award(id,b)) setTimeout(()=>toast(`🏅 شارة جديدة: ${BADGES.find(x=>x.id===b).name}`),900); }); toast(`أهلًا ${n.split(" ")[0]}`); if(online) Remote.push(); go("ch","c1"); };
  $("#ft").onsubmit=async e=>{ e.preventDefault(); const em=$("#tem").value.trim(), pw=$("#tc").value.trim();
    if(em){ if(!(window.Remote&&Remote.on)){ $("#te").textContent="تعذّر الوصول إلى قاعدة البيانات. تأكدي من الاتصال بالإنترنت."; return; }
      $("#te").textContent="جارٍ التحقق…"; try{ await Remote.adminLogin(em,pw); }catch(err){ $("#te").textContent=err.status===400?"البريد أو كلمة المرور غير صحيحة.":"تعذّر الاتصال بقاعدة البيانات، حاولي مرة أخرى."; Remote.setSt({adm:null}); return; }
      setSes({role:"teacher"}); $("#te").textContent="جارٍ جلب بيانات الطالبات…"; await Remote.ensureAll(true);
      if(Remote.err&&/admin/i.test(Remote.err.message||"")){ Remote.logout(); setSes(null); $("#te").textContent="هذا الحساب ليس حساب أدمن."; return; }
      go("teacher"); return; }
    if(pw.toUpperCase()==="LU71"){ setSes({role:"teacher"}); go("teacher"); } else $("#te").textContent="اكتبي البريد وكلمة المرور."; };
}

<script>
/* =================== SVG glassware kit =================== */
let CLIP=0;
const KIT={

  room(){ return `<rect width="800" height="460" fill="url(#gWall)"/><rect width="800" height="400" fill="url(#pGrid)"/>

  clip(d){ const id="cp"+(++CLIP); return {id, def:`<clipPath id="${id}"><path d="${d}"/></clipPath>`}; },
  liquid(d, top, bottom, col, wave){ const c=KIT.clip(d); const w=wave?`<path d="M-10 ${top} q20 -4 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V${bottom+10} H-10Z" fill="${col}" opacity=".9"/>`:`<rect x="0" y="${top}" width="800" height="${bottom-top+10}" fill="${col}" opacity=".88"/>`;
    return `${c.def}<g clip-path="url(#${c.id})">${w}<rect x="0" y="${top}" width="800" height="3" fill="#fff" opacity=".35"/></g>`; },
  beaker(cx,by,w,h,lv,col,o={}){ const x=cx-w/2, d=`M${x} ${by-h} V${by-10} Q${x} ${by} ${x+10} ${by} H${x+w-10} Q${x+w} ${by} ${x+w} ${by-10} V${by-h}`;
    const top=by-(h-8)*clamp(lv,0,1); let s=lv>0?KIT.liquid(d+"Z",top,by,col,o.wave):"";

    s+=`<rect x="${x+w-14}" y="${by-h+10}" width="5" height="${h-26}" rx="2.5" fill="#fff" opacity=".18"/>`;
    if(o.label) s+=`<text class="lbl" x="${cx}" y="${by+20}" text-anchor="middle">${o.label}</text>`; return s; },
  tube(cx,by,h,lv,col,o={}){ const w=o.w||34, r=w/2, d=`M${cx-r} ${by-h} V${by-r} A${r} ${r} 0 0 0 ${cx+r} ${by-r} V${by-h}`;
    const top=by-(h-6)*clamp(lv,0,1); let s="";

  cylinder(cx,by,h,lv,col,o={}){ const w=o.w||30, d=`M${cx-w/2} ${by-h} V${by-8} H${cx+w/2} V${by-h}`; const top=by-8-(h-14)*clamp(lv,0,1);

  balance(cx,by,read,o={}){ return `<g><rect x="${cx-95}" y="${by-54}" width="190" height="54" rx="14" fill="url(#gDark)" stroke="#4D95FF"/>

</div>
    <nav class="tabs"><div class="tabrow" role="tablist">${items.map(it=>`<button class="tab" role="tab" data-k="${it.k}" aria-selected="${it.k===cur}">${it.t}${sid&&it.e&&D.prog[sid]?.[it.k]?.done?'<span class="ok">✓</span>':""}</button>`).join("")}</div></nav>

/* =================== experiment engine =================== */
const SAFE={goggles:"نظارات واقية",coat:"معطف المختبر",gloves:"قفازات",fire:"خطر اللهب",chem:"مواد كيميائية",glass:"أدوات زجاجية",food:"لا تتذوقي",hot:"سطح ساخن",fumes:"أبخرة"};
function runExp(el,E){
  const sid=isStu()?App.s.sid:null;
  const P=sid?Store.prog(sid,E.id):(runExp._tmp=runExp._tmp||{})[E.id]=(runExp._tmp[E.id]||{steps:[],answers:{},report:{},status:"preview",tries:0});
  let st=E.init(); st.done=new Set(); st.obs=[]; st.t=0;
  let _att=false,_cmp=false; const mark=i=>{ if(!st.done.has(i)){ st.done.add(i); if(sid&&!_att){ _att=true; Store.hit(sid,"exp",E.id); } if(sid&&!_cmp&&st.done.size===E.steps.length){ _cmp=true; Store.hit(sid,"done",E.id); } onProgress(); } };
  st.mark=mark; st.note=o=>{ if(!st.obs.includes(o)) st.obs.push(o); };
  el.innerHTML=`<div class="stack" style="gap:18px">
    <div class="xhead"><div class="row"><span class="tag ${E.kind==="launch"?"":E.kind==="mini"?"a":"p"}">${E.kind==="launch"?"التجربة الاستهلالية":E.kind==="mini"?"تجربة عملية · دليل التجارب العملية":"مختبر الكيمياء"}</span><span class="tag m">كتاب كيمياء 1 · صفحة ${E.page}</span>${P.status==="submitted"?'<span class="tag a">أُرسل التقرير</span>':P.status==="graded"?`<span class="tag">قُيّم: ${P.grade}/10</span>`:""}</div>
      <h2>${E.title}</h2><div class="qbox">${E.question}</div>${E.intro?`<p class="muted">${E.intro}</p>`:""}</div>
    <div class="lab">
      <div class="stack">
        <div class="bench"><div class="traybar"><div class="row" style="justify-content:space-between;gap:6px"><b class="small">المواد والأدوات</b><span class="muted xs">اسحبي الأداة إلى مكانها على الطاولة، أو اضغطيها ثم اضغطي مكانها</span></div><div class="tray" id="tray"></div></div><svg class="scene" id="scene" viewBox="0 0 800 460" role="img" aria-label="طاولة التجربة"></svg><div class="sensors" id="sens"></div></div>
      </div>
      <div class="stack">
        <div class="card stack" style="gap:10px"><div class="row" style="justify-content:space-between"><b>خطوات العمل</b><button class="btn ghost sm" id="rst">↺ إعادة ضبط طاولة التجارب</button></div>
          <ol class="steps" id="steps"></ol><div class="actions" id="acts"></div><div class="fb" id="fb" aria-live="polite"></div></div>
        <div class="card stack" style="gap:8px"><b>إجراءات السلامة</b><div class="row" style="gap:6px">${E.safety.map(k=>`<span class="tag ${k==="fire"||k==="chem"||k==="fumes"?"k":"a"}">${SAFE[k]}</span>`).join("")}</div>${E.warn?`<span class="small" style="color:var(--pink)">تحذير: ${E.warn}</span>`:""}</div>
        <div class="card stack" style="gap:8px"><b>ملاحظاتك المسجّلة</b><ul id="obs" class="small" style="margin:0;padding-inline-start:18px;color:var(--body)"></ul></div>

    <details class="rep" id="rep"><summary><span>📝 التقرير المعملي</span><span class="tag m" style="font-family:var(--bodyf);font-size:12px">${({new:"لم يبدأ",draft:"مسودة",submitted:"أُرسل للمعلمة",graded:"قُيّم",preview:"معاينة"})[P.status]||""}</span></summary><div class="in" id="repin"></div></details>
  </div>`;
  const scene=$("#scene",el);
  const draw=()=>{ CLIP=0; scene.innerHTML=KIT.defs()+KIT.room()+E.view(st); };
  const sens=()=>{ $("#sens",el).innerHTML=E.sensors(st).map(s=>`<div class="sensor ${s.c||""}"><span>${s.l}</span><b>${s.v}</b></div>`).join(""); };
  const steps=()=>{ const cur=E.steps.findIndex((_,i)=>!st.done.has(i)); $("#steps",el).innerHTML=E.steps.map((t,i)=>`<li class="${st.done.has(i)?"done":i===cur?"cur":""}">${t}</li>`).join(""); };
  const acts=()=>{ const a=E.actions?E.actions(st):[]; $("#acts",el).innerHTML=a.map(x=>`<button class="btn sm ${x.pri?"pri":""}" data-a="${x.id}" ${x.dis?"disabled":""}>${x.label}</button>`).join(""); $$("#acts button",el).forEach(b=>b.onclick=()=>{ const r=E.act(st,b.dataset.a); fb(r); update(); }); };
  const tray=()=>{ $("#tray",el).innerHTML=E.tray(st).map(t=>`<button class="item ${t.used?"used":""}" data-i="${t.id}" ${t.used?"disabled":""} style="${t.col?`color:${t.col}`:""}">${t.ic||IC.tool}<span style="color:var(--ink)">${t.label}</span></button>`).join(""); bindTray(); };
  const data=()=>{ const d=E.data(st); $("#dt",el).innerHTML=`<table><thead><tr>${d.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i&&/^[\d.\-−+×e ]+$/.test(String(c))?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`; };
  const obs=()=>{ $("#obs",el).innerHTML=st.obs.length?st.obs.map(o=>`<li>${o}</li>`).join(""):`<li class="muted">ستظهر ملاحظاتك هنا أثناء التجربة.</li>`; };
  function fb(r){ if(!r) return; const f=$("#fb",el); if(r.warn){ toast("⚠ "+r.warn,"w"); f.innerHTML=`<span style="color:var(--amber)">${r.warn}</span>`; } else if(r.no) f.innerHTML=`<span style="color:var(--pink)">${r.no}</span>`; else if(r.ok) f.innerHTML=`<span style="color:var(--good)">${r.ok}</span>`; }
  function update(){ draw(); sens(); steps(); acts(); tray(); data(); obs(); }
  function onProgress(){ if(st.done.size===E.steps.length){ P.steps=E.steps.map((_,i)=>i); P.data=E.data(st); P.obs=st.obs.slice(); P.res=E.result?E.result(st):null; save(); checkDone(); renderQA(); } }
  const save=()=>{ if(sid) Store.save(); };
  rerenderScene=()=>draw();
  /* drag & drop */
  let armed=null;
  function bindTray(){
    $$(".item",el).forEach(it=>{ if(it.disabled) return;
      it.onpointerdown=e=>{ e.preventDefault(); const id=it.dataset.i, sx=e.clientX, sy=e.clientY; let g=null, moved=false, hot=null;
        const mv=ev=>{ if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ moved=true; g=it.cloneNode(true); g.classList.add("dragghost"); $("#app").appendChild(g); scene.classList.add("dragging"); }
          if(g){ g.style.left=ev.clientX+"px"; g.style.top=ev.clientY+"px"; const z=document.elementFromPoint(ev.clientX,ev.clientY)?.closest?.("[data-drop]"); if(hot&&hot!==z) hot.classList.remove("hot"); hot=z; if(z) z.classList.add("hot"); } };
        const up=ev=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); scene.classList.remove("dragging"); if(g) g.remove();
          if(moved){ if(hot){ hot.classList.remove("hot"); doDrop(id,hot.dataset.drop); } }
          else { armed = armed===id?null:id; $$(".item",el).forEach(x=>x.setAttribute("aria-pressed",x.dataset.i===armed)); scene.classList.toggle("armed",!!armed); if(armed) $("#fb",el).innerHTML=`<span class="muted">اضغطي الآن المكان المناسب على الطاولة.</span>`; } };
        addEventListener("pointermove",mv); addEventListener("pointerup",up); };
    });
  }
  scene.addEventListener("click",e=>{ const z=e.target.closest("[data-drop]"); const c=e.target.closest("[data-click]");
    if(armed&&z){ const a=armed; armed=null; scene.classList.remove("armed"); doDrop(a,z.dataset.drop); return; }
    if(c&&E.click){ fb(E.click(st,c.dataset.click)); update(); } });
  function doDrop(item,zone){ const r=E.drop(st,item,zone)||{no:"هذا ليس المكان المناسب لهذه الأداة."}; fb(r); update(); }
  $("#rst",el).onclick=()=>{ st=E.init(); st.done=new Set(); st.obs=[]; st.t=0; _att=false; _cmp=false; st.mark=mark; st.note=o=>{ if(!st.obs.includes(o)) st.obs.push(o); }; P.tries=(P.tries||0)+1; save(); if(sid) award("persist"); $("#fb",el).innerHTML=`<span class="muted">أُعيد ضبط الطاولة. المحاولة ${P.tries+1}.</span>`; update(); };
  /* loop */
  let raf=0,last=performance.now();
  const loop=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; st.t+=dt; if(E.tick&&E.tick(st,dt)){ draw(); sens(); if(st._dirty){ st._dirty=false; steps(); acts(); tray(); data(); obs(); } } raf=requestAnimationFrame(loop); };
  raf=requestAnimationFrame(loop); App.cleanup.push(()=>cancelAnimationFrame(raf));
  /* analysis */
  const SEL={}, SHOWM={};
  const fmtAns=v=>{ if(v==null||isNaN(v)) return "—"; const a=Math.abs(v); return a>=1e5||(a>0&&a<1e-3)?v.toExponential(2):String(+v.toFixed(2)); };
  function renderQA(){
    const qa=$("#qa",el), stepsDone=st.done.size===E.steps.length||(P.steps||[]).length===E.steps.length;
    const RES=P.res||(E.result&&stepsDone?E.result(st):null);
    let okN=0, chkN=0;
    const html=E.analysis.map((q,i)=>{ const a=P.answers[i]; const QA=q.aFn?(RES?q.aFn(RES):-1):q.a;
      let body="";
      if(q.type==="mcq"){ chkN++; const tries=P.answers["w"+i]||0, lw=P.answers["x"+i];
        if(a!=null){ const right=a===QA; if(right) okN++;
          body=`<div class="opts">${q.o.map((o,k)=>`<button class="opt ${k===QA?"right":k===a?"wrong":""}" disabled>${o}</button>`).join("")}</div>
          <div class="verdict ${right?"ok":"no"}">${right?`✔ أحسنتِ! إجابة صحيحة${tries?` بعد ${tries+1} محاولات`:" من المحاولة الأولى"}.`:"الإجابة الصحيحة موضّحة باللون الأخضر."}</div><div class="why">${q.why}</div>`; }
        else { const sel=SEL[i];
          body=`<div class="opts">${q.o.map((o,k)=>`<button class="opt ${sel===k?"sel":lw===k&&sel==null?"wrong":""}" data-q="${i}" data-k="${k}" ${QA<0?"disabled":""}>${o}</button>`).join("")}</div>
          <div class="row chkrow"><button class="btn sm pri" data-c="${i}" ${sel==null||QA<0?"disabled":""}>✓ تحققي من الإجابة</button>${tries>=2?`<button class="btn sm ghost" data-r="${i}">إظهار الإجابة</button>`:""}
          ${tries?`<span class="verdict no">✘ ليست صحيحة، راجعي بياناتك وحاولي مرة أخرى.</span>`:QA<0?`<span class="muted small">أكملي التجربة أولًا.</span>`:`<span class="muted small">اختاري إجابة ثم اضغطي «تحققي».</span>`}</div>`; } }
      else if(q.type==="num"){ chkN++; const ok=P.answers["ok"+i], nw=P.answers["nw"+i]||0; if(ok) okN++;
        const want=RES?q.ans(RES):null;
        body=`<div class="row"><input class="inp" style="max-width:220px;direction:ltr;text-align:left;font-family:var(--mono)" id="n${i}" value="${esc(a??"")}" inputmode="decimal" placeholder="${q.ph||""}" ${ok?"readonly":""}><span class="muted mono">${q.unit||""}</span>${ok?"":`<button class="btn sm pri" data-n="${i}">✓ تحققي من الإجابة</button>`}${!ok&&nw>=3&&want!=null?`<button class="btn sm ghost" data-s="${i}">عرض الحل</button>`:""}</div>
        ${ok!=null?`<div class="verdict ${ok?"ok":"no"}">${ok?"✔ إجابة صحيحة، أحسنتِ!":`✘ راجعي حسابك وحاولي مرة أخرى (المحاولة ${nw}).`} ${!ok&&q.hint?`<span class="hint">💡 ${q.hint}</span>`:""}</div>`:""}
        ${SHOWM[i]&&want!=null?`<div class="mans"><b>الإجابة المتوقعة من بياناتك:</b> <span dir="ltr" class="mono">${fmtAns(want)} ${q.unit||""}</span>${q.hint?`<br>${q.hint}`:""}</div>`:""}`; }
      else { const c=q.g?P.answers["tc"+i]:null; if(q.g){ chkN++; if(c&&c.ok) okN++; }
        body=`<textarea class="inp" data-t="${i}" placeholder="${q.ph||"اكتبي إجابتك بجمل كاملة"}">${esc(a||"")}</textarea>
        ${q.g?`<div class="row chkrow"><button class="btn sm pri" data-tc="${i}">✓ تحققي من إجابتي</button>${c?`<button class="btn sm ghost" data-m="${i}">${SHOWM[i]?"إخفاء":"عرض"} الإجابة النموذجية</button>`:""}</div>
        ${c?`<div class="verdict ${c.ok?"ok":"no"}">${c.ok?`✔ إجابة وافية: ذكرتِ ${c.n} من ${q.g.length} أفكار رئيسة.`:`ذكرتِ ${c.n} من ${q.g.length} أفكار رئيسة. أضيفي ما ينقص ثم تحققي مجددًا.`}</div>
        <div class="ideas">${q.g.map((g,k)=>c.hit[k]?`<span class="idea y">✔ ${g.h.replace(/[؟?].*$/,"")}</span>`:`<span class="idea n">💡 ${g.h}</span>`).join("")}</div>`:""}
        ${SHOWM[i]?`<div class="mans"><b>إجابة نموذجية:</b> ${q.model}</div>`:""}`:""}`; }
      return `<div class="q"><div class="qt"><b>${i+1}.</b> ${q.q}</div>${body}</div>`; }).join("");
    qa.innerHTML=(chkN?`<div class="score"><span>نتيجة التحقق</span><b>${okN} / ${chkN}</b><div class="bar"><i style="width:${okN/chkN*100}%"></i></div></div>`:"")+html+(stepsDone?"":`<div class="note w small">أكملي خطوات العمل أولًا؛ بعض الأسئلة تعتمد على بياناتك.</div>`);
    $$(".opt[data-k]",qa).forEach(b=>b.onclick=()=>{ SEL[b.dataset.q]=+b.dataset.k; renderQA(); });
    $$("button[data-c]",qa).forEach(b=>b.onclick=()=>{ const i=+b.dataset.c, q=E.analysis[i], QA=q.aFn?q.aFn(P.res||(E.result?E.result(st):null)):q.a, s=SEL[i]; if(s==null) return;
      if(s===QA){ P.answers[i]=s; toast("✔ إجابة صحيحة"); } else { P.answers["w"+i]=(P.answers["w"+i]||0)+1; P.answers["x"+i]=s; }
      delete SEL[i]; save(); checkDone(); renderQA(); });
    $$("button[data-r]",qa).forEach(b=>b.onclick=()=>{ const i=+b.dataset.r; P.answers[i]=P.answers["x"+i]; save(); checkDone(); renderQA(); });
    $$("textarea[data-t]",qa).forEach(t=>t.oninput=()=>{ P.answers[t.dataset.t]=t.value; clearTimeout(t._t); t._t=setTimeout(()=>{save();checkDone();},500); });
    $$("button[data-tc]",qa).forEach(b=>b.onclick=()=>{ const i=+b.dataset.tc, q=E.analysis[i], v=$(`textarea[data-t="${i}"]`,qa).value; P.answers[i]=v;

      P.answers["tc"+i]=textCheck(q,v); save(); checkDone(); renderQA(); });
    $$("button[data-m]",qa).forEach(b=>b.onclick=()=>{ const i=+b.dataset.m; SHOWM[i]=!SHOWM[i]; renderQA(); });
    $$("button[data-s]",qa).forEach(b=>b.onclick=()=>{ const i=+b.dataset.s; SHOWM[i]=true; renderQA(); });
    $$("button[data-n]",qa).forEach(b=>b.onclick=()=>{ const i=+b.dataset.n, q=E.analysis[i], v=$("#n"+i,qa).value; P.answers[i]=v; const want=q.ans(P.res||(E.result?E.result(st):null));
      if(want==null){ $("#fb",el).innerHTML=`<span style="color:var(--amber)">أكملي التجربة أولًا للحصول على بياناتك.</span>`; toast("أكملي التجربة أولًا","w"); return; }
      const n=numIn(v); const ok=!isNaN(n)&&Math.abs(n-want)<=Math.abs(want)*(q.tol||.03)+(q.abs||0); P.answers["ok"+i]=ok; if(!ok) P.answers["nw"+i]=(P.answers["nw"+i]||0)+1; else toast("✔ إجابة صحيحة"); save(); checkDone(); renderQA(); });
  }
  function checkDone(){ if(!sid||P.done) return; if((P.steps||[]).length!==E.steps.length) return;
    const all=E.analysis.every((q,i)=>q.type==="text"?String(P.answers[i]||"").trim().length>=3: q.type==="num"? P.answers["ok"+i]!=null : P.answers[i]!=null);
    if(!all) return; P.done=true; P.doneAt=Date.now(); save(); toast("أكملتِ التجربة ✓ اكتبي تقريرك المعملي الآن"); award("first");
    const mcqs=E.analysis.map((q,i)=>[q,i]).filter(([q])=>q.type==="mcq"); if(mcqs.length&&mcqs.every(([q,i])=>P.answers[i]===(q.aFn?q.aFn(P.res):q.a))) award("analyst");
    const pr=D.prog[sid]; if(EXPS.filter(e=>e.kind==="launch"&&pr[e.id]?.done).length>=3) award("observer"); if(EXPS.every(e=>pr[e.id]?.done)) award("future"); }
  /* report */
  function renderRep(){

      ${P.status==="graded"?`<div class="note g"><b>تقييم المعلمة: ${P.grade}/10</b>${P.comment?`<br>${esc(P.comment)}`:""}</div>`:""}

      <label class="f" for="rh">الفرضية العلمية<textarea class="inp" id="rh" ${sent?"readonly":""} placeholder="${E.hyp||"إذا … فإن … لأن …"}">${esc(R.hyp||"")}</textarea></label>
      <div class="vars"><label class="f" for="ri">المتغير المستقل<input class="inp" id="ri" ${sent?"readonly":""} value="${esc(R.ind||"")}" placeholder="ما الذي تغيّرينه عمدًا؟"></label><label class="f" for="rd">المتغير التابع<input class="inp" id="rd" ${sent?"readonly":""} value="${esc(R.dep||"")}" placeholder="ما الذي تقيسينه أو تلاحظينه؟"></label><label class="f" for="rc">الثوابت<input class="inp" id="rc" ${sent?"readonly":""} value="${esc(R.cons||"")}" placeholder="ما الذي تُبقينه ثابتًا؟"></label></div>
      ${E.vars?`<div class="row chkrow"><button class="btn sm" id="vchk">✓ تحققي من المتغيرات</button><span id="vres" class="small"></span></div><div id="vmodel"></div>`:""}
      <div class="stack" style="gap:6px"><b class="small">جدول المشاهدات والبيانات (من طاولة التجربة)</b><div class="tbl"><table><thead><tr>${d.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>
      <label class="f" for="rco">الاستنتاج<textarea class="inp" id="rco" ${sent?"readonly":""} placeholder="ماذا تستنتجين؟ ادعمي استنتاجك ببياناتك.">${esc(R.concl||"")}</textarea></label>
      <span class="muted xs">تُضاف إجاباتك عن أسئلة التحليل إلى التقرير تلقائيًا.</span>
      <div class="row">${sid?`<button class="btn ghost" id="rs" ${sent?"disabled":""}>حفظ كمسودة</button><button class="btn pur" id="rsub" ${sent?"disabled":""}>إرسال للمعلمة</button>`:""}<button class="btn" id="rpr">🖨 طباعة / حفظ PDF</button>${inFrame?"":`<button class="btn ghost" id="rdl">تنزيل ملف التقرير</button>`}<span class="small" id="rmsg"></span></div>`;
    const rd=()=>{ R.hyp=$("#rh",el).value; R.ind=$("#ri",el).value; R.dep=$("#rd",el).value; R.cons=$("#rc",el).value; R.concl=$("#rco",el).value; };
    const vb=$("#vchk",el); if(vb) vb.onclick=()=>{ rd(); const L=["المتغير المستقل","المتغير التابع","الثوابت"], G=[R.ind,R.dep,R.cons];
      if(G.every(g=>!String(g||"").trim())){ $("#vres",el).innerHTML=`<span style="color:var(--amber)">اكتبي المتغيرات أولًا.</span>`; return; }
      const r=G.map((g,k)=>varCheck(E.vars[k],g)); const n=r.filter(Boolean).length; R.vok=n; save();
      $("#vres",el).innerHTML=r.map((ok,k)=>`<span class="idea ${ok?"y":"n"}">${ok?"✔":"✘"} ${L[k]}</span>`).join(" ")+(n<3?` <button class="btn sm ghost" id="vshow">عرض الإجابة</button>`:` <b style="color:var(--good)">ممتاز!</b>`);
      const sh=$("#vshow",el); if(sh) sh.onclick=()=>{ $("#vmodel",el).innerHTML=`<div class="mans"><b>المستقل:</b> ${E.vars[0]}<br><b>التابع:</b> ${E.vars[1]}<br><b>الثوابت:</b> ${E.vars[2]}</div>`; }; };
    const s=$("#rs",el); if(s) s.onclick=()=>{ rd(); if(P.status==="new") P.status="draft"; save(); $("#rmsg",el).innerHTML=`<span style="color:var(--good)">حُفظت المسودة على هذا الجهاز.</span>`; };
    const sb=$("#rsub",el); if(sb) sb.onclick=()=>{ rd(); if((P.steps||[]).length!==E.steps.length){ $("#rmsg",el).innerHTML=`<span style="color:var(--pink)">أكملي خطوات التجربة قبل الإرسال.</span>`; return; } if(R.hyp.trim().length<5||R.concl.trim().length<5){ $("#rmsg",el).innerHTML=`<span style="color:var(--pink)">اكتبي الفرضية والاستنتاج قبل الإرسال.</span>`; return; }
      P.status="submitted"; P.submittedAt=Date.now(); save(); toast("أُرسل التقرير إلى المعلمة"); const n=EXPS.filter(e=>["submitted","graded"].includes(D.prog[sid][e.id]?.status)).length; if(n>=3) award("writer"); renderRep(); };
    $("#rpr",el).onclick=()=>{ rd(); save(); printReport(reportHTML(E,P,sid)); };
    if($("#rdl",el)) $("#rdl",el).onclick=async()=>{ rd(); save(); const html=reportHTML(E,P,sid); const dl=await getDL();
      if(!dl){ $("#rmsg",el).innerHTML=`<span style="color:var(--amber)">التنزيل غير متاح في هذا العرض.</span>`; return; }
      try{ await dl.save({filename:`تقرير-${E.id}-${sid?Store.st(sid).name:"معاينة"}.html`,data:html}); $("#rmsg",el).innerHTML=`<span style="color:var(--good)">افتحي الملف واطبعيه أو احفظيه PDF.</span>`; }catch(err){ if(err?.code!=="declined") $("#rmsg",el).innerHTML=`<span style="color:var(--pink)">تعذر التنزيل.</span>`; } };
  }
  if(P.steps&&P.steps.length===E.steps.length){ /* already finished before: keep data snapshot */ }
  update(); renderQA(); renderRep();
}
function reportHTML(E,P,sid){
  const s=sid?Store.st(sid):{name:"—",cls:"—"}, R=P.report||{}, d=P.data||{cols:[],rows:[]};
  const LF=x=>{ x=String(x??""); return /</.test(x)?x:ltrFix(x); };
  const qa=E.analysis.map((q,i)=>{ const a=P.answers?.[i]; const txt=q.type==="mcq"?(a!=null?q.o[a]:"—"):(a||"—"); return `<li><b>${q.q}</b><br>${ltrFix(esc(String(txt).replace(/<[^>]+>/g,"")))}</li>`; }).join("");
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير معملي - ${esc(E.title)}</title><style>body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:#18203a;max-width:820px;margin:30px auto;padding:0 20px;line-height:1.8}h1{font-size:26px;margin:0;color:#4F29B6}h2{font-size:17px;color:#3A7FEA;border-bottom:2px solid #E4EFFF;padding-bottom:4px;margin-top:22px}.hd{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid #4F29B6;padding-bottom:12px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;background:#F0F9FF;border-radius:12px;padding:12px 16px;margin-top:14px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d9dfeb;padding:6px 10px;text-align:right}th{background:#f1f4fa}.lu{display:inline-block;background:#4F29B6;color:#fff;font-weight:800;border-radius:10px;padding:4px 10px;direction:ltr}img{height:54px}</style></head><body>
  <div class="hd"><div><span class="lu">71 Lu</span> <b>مختبر اللوتيتيوم الافتراضي</b><h1>${esc(E.title)}</h1><div>كتاب كيمياء 1 · صفحة ${E.page}</div></div><img src="${LOGO}" alt=""></div>
  <div class="meta"><div><b>الطالبة:</b> ${esc(s.name)}</div><div><b>الشعبة:</b> ${esc(s.cls)}</div><div><b>التاريخ:</b> ${today()}</div><div><b>الحالة:</b> ${P.status==="graded"?"قُيّم ("+P.grade+"/10)":P.status==="submitted"?"مُرسل":"مسودة"}</div></div>
  <h2>السؤال</h2><p>${E.question}</p><h2>الفرضية العلمية</h2><p>${esc(R.hyp||"—")}</p>
  <h2>المتغيرات</h2><table><tr><th>المستقل</th><th>التابع</th><th>الثوابت</th></tr><tr><td>${esc(R.ind||"—")}</td><td>${esc(R.dep||"—")}</td><td>${esc(R.cons||"—")}</td></tr></table>
  <h2>جدول المشاهدات والبيانات</h2><table><tr>${d.cols.map(c=>`<th>${LF(c)}</th>`).join("")}</tr>${d.rows.map(r=>`<tr>${r.map(c=>`<td>${LF(c)}</td>`).join("")}</tr>`).join("")}</table>
  ${(P.obs||[]).length?`<h2>الملاحظات</h2><ul>${P.obs.map(o=>`<li>${LF(o)}</li>`).join("")}</ul>`:""}
  <h2>التحليل</h2><ol>${qa}</ol><h2>الاستنتاج</h2><p>${esc(R.concl||"—")}</p>${P.comment?`<h2>ملاحظة المعلمة</h2><p>${esc(P.comment)}</p>`:""}
  <p style="margin-top:30px;color:#888;font-size:13px">إعداد وتنفيذ المعلمة لوله زربطان · ثانوية الموهوبين التقنية</p></body></html>`;
}
</script>

<script>
const CHAPTERS=[
  {id:"c1",bg:"linear-gradient(135deg,#5C9EFF,#3A7FEA)",no:1,short:"مقدمة في الكيمياء",title:"مقدمة في علم الكيمياء",color:"linear-gradient(135deg,#5C9EFF,#3A7FEA)",lessons:["1-1 قصة مادتين","1-2 الكيمياء والمادة","1-3 الطرائق العلمية","1-4 البحث العلمي"]},
  {id:"c2",bg:"linear-gradient(135deg,#6A45CC,#4F29B6)",no:2,short:"المادة",title:"المادة: الخواص والتغيرات",color:"linear-gradient(135deg,#6A45CC,#4F29B6)",lessons:["2-1 خواص المادة","2-2 تغيرات المادة","2-3 المخاليط","2-4 العناصر والمركبات"]},
  {id:"c3",bg:"linear-gradient(135deg,#57E2D7,#1FB5AA)",no:3,short:"تركيب الذرة",title:"تركيب الذرة",color:"linear-gradient(135deg,#57E2D7,#1FB5AA)",lessons:["3-1 الأفكار القديمة للمادة","3-2 تعريف الذرة","3-3 كيف تختلف الذرات؟","3-4 الأنوية غير المستقرة"]},
  {id:"c4",bg:"linear-gradient(135deg,#F7BC85,#F3A564)",no:4,short:"التفاعلات",title:"التفاعلات الكيميائية",color:"linear-gradient(135deg,#F7BC85,#F3A564)",lessons:["4-1 التفاعلات والمعادلات","4-2 تصنيف التفاعلات","4-3 التفاعلات في المحاليل المائية"]},
  {id:"c5",bg:"linear-gradient(135deg,#FF9A9A,#FF8080)",no:5,short:"المول",title:"المول",color:"linear-gradient(135deg,#FF9A9A,#FF8080)",lessons:["5-1 قياس المادة","5-2 الكتلة والمول","5-3 مولات المركبات"]},
];
const EXPS=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
const mmss=m=>{ const s=Math.round(m*60); return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; };

/* ============ 1. أين ذهبت الكتلة؟ (ص 13) ============ */
EXPS.push({id:"e11",ch:"c1",kind:"launch",page:13,title:"أين ذهبت الكتلة؟",
  question:"عندما يحترق جسم فإن ما يتبقى من كتلته يكون غالبًا أقل من كتلة الجسم الأصلي! ماذا يحدث لكتلة أي جسم عند احتراقه؟",
  safety:["goggles","coat","fire","hot"],warn:"لا تلقي أعواد الثقاب في المغسلة.",
  steps:["اسحبي الشمعة إلى الميزان الرقمي وسجّلي كتلتها.","انقلي الشمعة إلى السطح المقاوم للاحتراق.","أشعلي الشمعة واتركيها تحترق خمس دقائق، ثم أطفئيها.","اتركي الشمعة تبرد.","أعيدي الشمعة إلى الميزان وقيسي كتلتها."],
  vars:["زمن احتراق الشمعة","الكتلة المفقودة","نوع الشمعة والميزان المستخدم"],hyp:"إذا احترقت الشمعة فإن كتلتها …… لأن ……",
  inquiry:"هل يمكن أن تختلف كمية المادة المفقودة؟ أعيدي التجربة بزمن احتراق مختلف، وحددي العوامل التي قد تعطي نتيجة مختلفة.",
  init(){ return {pos:"shelf",m0:+rnd(90.4,90.9).toFixed(2),burn:0,lit:false,cool:0,coolT:0,before:null,after:null,smoke:[]}; },
  mass(s){ return s.m0-s.burn*0.11; },
  tray(s){ return [{id:"candle",label:s.lit?"الشمعة (مشتعلة)":"الشمعة",ic:IC.candle,used:s.lit}]; },
  drop(s,it,z){
    if(z==="pan"){ if(s.cool===1) return {warn:"انتظري حتى تبرد الشمعة قبل وزنها؛ الحرارة قد تتلف الميزان وتغيّر القراءة."};
      if(s.before!=null&&s.burn===0){ s.pos="balance"; return {ok:"الكتلة كما هي، لم تحترق الشمعة بعد."}; }
      s.pos="balance";
      if(s.before==null){ s.before=+this.mass(s).toFixed(2); s.mark(0); s.note(`كتلة الشمعة قبل الاحتراق ${s.before} g، وطولها يقارب 6 cm.`); return {ok:`سجّلتِ الكتلة: ${s.before} g`}; }
      if(s.cool===2){ s.after=+this.mass(s).toFixed(2); s.mark(4); s.note(`كتلة الشمعة بعد الاحتراق ${s.after} g.`); return {ok:`الكتلة الآن ${s.after} g. قارنيها بالكتلة الأولى.`}; }
      return {ok:"وُضعت الشمعة على الميزان."}; }
    if(z==="pad"){ if(s.before==null) return {no:"قيسي كتلة الشمعة أولًا (الخطوة 2 في الكتاب)."}; s.pos="pad"; s.mark(1); return {ok:"الشمعة على سطح مقاوم للاحتراق. أشعليها الآن."}; }
  },
  actions(s){ return [{id:"light",label:"🔥 أشعلي الشمعة",pri:true,dis:!(s.pos==="pad"&&!s.lit&&s.cool!==1&&s.after==null)},{id:"out",label:"أطفئي الشمعة",dis:!s.lit}]; },
  act(s,id){
    if(id==="light"){ s.lit=true; s.cool=0; return {ok:"اشتعلت الشمعة. يمر الزمن هنا أسرع: كل ثانية تعادل نصف دقيقة."}; }
    if(id==="out"){ s.lit=false; s.cool=1; s.coolT=0; for(let i=0;i<14;i++) s.smoke.push({x:560+rnd(-3,3),y:262,a:1,v:rnd(18,30),d:rnd(-6,6)});
      s.note("تصاعد خيط دخان رمادي عند إطفاء الشمعة.");
      if(s.burn<4.95) return {warn:`أطفأتِها بعد ${mmss(s.burn)} دقيقة. تطلب الخطوة 3 خمس دقائق؛ يمكنك إعادة إشعالها بعد أن تبرد.`};
      s.mark(2); return {ok:`احترقت الشمعة مدة ${mmss(s.burn)}. انتظري حتى تبرد.`}; }
  },
  tick(s,dt){ let ch=false;
    if(s.lit){ s.burn+=dt*.5; ch=true; if(s.burn>1) s.note("ذاب الشمع حول الفتيل وتكوّن سائل شفاف."); if(s.burn>3.5) s.note("قلّ ارتفاع الشمعة قليلًا، واسودّ طرف الفتيل."); if(Math.floor(s.burn*2)!==Math.floor((s.burn-dt*.5)*2)) s._dirty=true; }
    if(s.cool===1){ s.coolT+=dt; ch=true; if(s.coolT>3.5){ s.cool=2; s._dirty=true; if(s.burn>=4.95) s.mark(3); else s.cool=0; s.note("تجمّد الشمع السائل مرة أخرى بعد أن بردت الشمعة."); } }
    if(s.smoke.length){ s.smoke.forEach(p=>{p.y-=p.v*dt;p.x+=Math.sin(p.y/12)*.6+p.d*dt;p.a-=dt*.45;}); s.smoke=s.smoke.filter(p=>p.a>0); ch=true; }
    return ch||s.lit; },
  candle(s,cx,by){ const loss=s.burn*1.3, h=46-loss; let g=`<g><path d="M${cx-34} ${by-62} L${cx-30} ${by} H${cx+30} L${cx+34} ${by-62}" class="gl"/>`;
    g+=`<rect x="${cx-28}" y="${by-4-h}" width="56" height="${h}" rx="4" fill="#FF8A3D"/><rect x="${cx-28}" y="${by-4-h}" width="56" height="${h}" rx="4" fill="url(#gGlass)"/>`;
    if(s.lit||s.cool===1) g+=`<ellipse cx="${cx}" cy="${by-4-h+2}" rx="${Math.min(24,6+s.burn*4)}" ry="4" fill="#FFD7A0" opacity=".9"/>`;
    g+=`<rect x="${cx-1.5}" y="${by-14-h}" width="3" height="11" fill="#2b2b2b"/>`;
    if(s.lit) g+=KIT.flame(cx,by-12-h,.85,s.t);
    return g+`</g>`; },
  view(s){ const m=this.mass(s); let v="";
    v+=KIT.balance(230,398,s.pos==="balance"?m.toFixed(2):"0.00",{label:"ميزان رقمي"});
    v+=`<rect x="490" y="380" width="140" height="18" rx="4" fill="#d9d4cc" opacity=".85"/><rect x="490" y="380" width="140" height="4" fill="#fff" opacity=".5"/>${KIT.label(560,420,"سطح مقاوم للاحتراق")}`;
    v+=`<rect x="665" y="300" width="110" height="10" rx="4" fill="url(#gMetal)"/>${KIT.label(720,330,"الرف")}`;
    const pos={balance:[230,332],pad:[560,380],shelf:[720,300]}[s.pos];
    v+=this.candle(s,pos[0],pos[1]);
    v+=s.smoke.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${5+(1-p.a)*9}" fill="#aab4c8" opacity="${p.a*.35}" filter="url(#soft)"/>`).join("");
    if(s.lit) v+=`<circle cx="560" cy="300" r="90" fill="#FFDA5E" opacity=".18" filter="url(#soft)"/>`;
    v+=`<g><rect x="30" y="30" width="200" height="64" rx="14" fill="#1E2257"/><text class="dlbl" x="130" y="54" text-anchor="middle">زمن الاحتراق</text><text x="130" y="84" text-anchor="middle" style="fill:#FFDA5E;font:600 26px var(--mono)">${mmss(s.burn)}</text></g>`;
    v+=KIT.zone("pan",140,250,180,95)+KIT.zone("pad",480,280,160,112);
    return v; },
  sensors(s){ return [{l:"قراءة الميزان",v:(s.pos==="balance"?this.mass(s).toFixed(2):"0.00")+" g"},{l:"زمن الاحتراق",v:mmss(s.burn),c:"a"},{l:"حالة الشمعة",v:s.lit?"مشتعلة":s.cool===1?"تبرد":"منطفئة",c:"p"}]; },
  data(s){ const d=s.before!=null&&s.after!=null?(s.before-s.after):null; return {cols:["القياس","القيمة"],rows:[["كتلة الشمعة قبل الاحتراق",s.before!=null?s.before.toFixed(2)+" g":"—"],["زمن الاحتراق",s.burn?mmss(s.burn)+" min":"—"],["كتلة الشمعة بعد الاحتراق",s.after!=null?s.after.toFixed(2)+" g":"—"],["الكتلة المفقودة",d!=null?d.toFixed(2)+" g":"—"]]}; },
  result(s){ return s.after!=null?{before:s.before,after:s.after,min:s.burn,loss:s.before-s.after}:null; },
  analysis:[
    {type:"text",q:"<b>لخّصي</b> ملاحظاتك عن الشمعة في أثناء احتراقها وبعد إطفائها."},
    {type:"mcq",q:"<b>قوّمي:</b> أين ذهبت المادة التي فُقدت؟",o:["فنيت واختفت تمامًا","تفاعلت مع أكسجين الهواء وتحولت إلى غازات (ثاني أكسيد الكربون وبخار الماء) انتشرت في الهواء","امتصها الميزان","تحولت كلها إلى ضوء"],a:1,why:"الشمع يحترق بتفاعله مع الأكسجين، والنواتج غازات تخرج إلى الهواء فلا يقيسها الميزان. الكتلة لم تفنَ بل انتقلت إلى مواد أخرى."},
    {type:"num",q:"<b>احسبي</b> معدل فقد الكتلة في الدقيقة من بياناتك.",unit:"g/min",tol:.06,ans:r=>r?r.loss/r.min:null,hint:"اقسمي الكتلة المفقودة على زمن الاحتراق بالدقائق."},
  ]});

/* ============ 2. تصنيف مقدار عسر الماء (ص 35) ============ */
EXPS.push({id:"e12",ch:"c1",kind:"lab",page:35,title:"تصنيف مقدار عسر الماء",
  question:"افترض وجود عينتين من الماء في مختبر تحليل الماء، إحداهما ماء يسر أُخذ من المنطقة A والأخرى ماء عسر أُخذ من المنطقة B. من أي منطقة أُخذت العينتان؟",
  intro:"يُصنف الماء إلى ماء عسر أو يسر بحسب كمية الكالسيوم أو المغنيسيوم الموجودة فيه، وتقاس بوحدة mg/L.",
  safety:["goggles","coat","glass"],
  steps:["ضعي 20 mL من كل عينة في أنبوبها: D للماء المقطر، 1 للعينة A، 2 للعينة B.","أضيفي قطرة من سائل تنظيف الأواني إلى كل أنبوب.","أغلقي الأنابيب بالسدادات ورجّي كل عينة مدة 30 s.","قيسي ارتفاع الرغوة في كل أنبوب بالمسطرة."],

  const EQ=["أشعة فوق بنفسجية تكسر رابطة C–Cl في CCl₃F فتنطلق ذرة كلور Cl","Cl + O₃ → ClO + O₂","ClO + O → Cl + O₂"];

    const arr=(a,b)=>`<div style="display:grid;gap:4px;text-align:center;min-width:120px"><span class="tag a" style="justify-content:center;font-family:var(--mono);direction:ltr">${a}</span><b style="color:var(--purple);font-size:22px">⇄</b><span class="tag p" style="justify-content:center;font-family:var(--mono);direction:ltr">${b}</span></div>`;
    $("#flow").innerHTML=`<div class="row" style="flex-wrap:wrap;align-items:center;justify-content:center;gap:12px">${node("كتلة المركب",sci(mass),"g",mode==="mass")}${arr("÷ "+M+" g/mol","× "+M+" g/mol")}${node("المولات",sci(mol),"mol",mode==="mol")}${arr("× 6.02×10²³","÷ 6.02×10²³")}${node("الجسيمات الممثلة",sci(n),"جسيم",mode==="n")}</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:18px">${Array.from({length:Math.min(60,Math.max(1,Math.round(mol*6)))},()=>`<span style="width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#E4EFFF,#4D95FF);display:inline-block;box-shadow:0 2px 6px rgba(77,149,255,.5)"></span>`).join("")}</div><p class="muted xs" style="text-align:center;margin-top:6px">كل كرة تمثل سُدس مول من ${nm}</p>`;
    const st=mode==="mass"?[`n = m ÷ M = ${v} g ÷ ${M} g/mol = ${sci(mol)} mol`,`N = n × 6.02×10²³ = ${sci(n)} جسيم`]:mode==="mol"?[`m = n × M = ${v} mol × ${M} g/mol = ${sci(mass)} g`,`N = n × 6.02×10²³ = ${sci(n)} جسيم`]:[`n = N ÷ 6.02×10²³ = ${sci(mol)} mol`,`m = n × M = ${sci(mass)} g`];
    $("#steps2").innerHTML=`<b>خطوات الحل</b>`+st.map((s,i)=>`<div class="note i small" style="direction:ltr;text-align:left;font-family:var(--mono)">${i+1}) ${s}</div>`).join("")+`<span class="muted xs">الكتلة المولية M لـ ${f} = ${M} g/mol</span>`; }
  $("#sub").onchange=e=>{si=+e.target.value;run();};
  $$("#md button").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; $$("#md button").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#vin").value=mode==="mass"?"36.04":mode==="mol"?"2":"1.204e24"; val=$("#vin").value; run(); });
  $("#vin").oninput=e=>{val=e.target.value;run();};
  run();
}
</script>

<script>
/* =================== نماذج بصرية إضافية لأشكال الكتاب =================== */
const stageBg=()=>KIT.defs()+`<rect width="800" height="460" fill="url(#gWall)"/><rect width="800" height="460" fill="url(#pGrid)"/>`;
const tx=(x,y,t,st="",anc="middle")=>`<text x="${x}" y="${y}" text-anchor="${anc}" class="lbl" style="${st}">${t}</text>`;
const ltx=(x,y,t,st="",anc="middle")=>`<text x="${x}" y="${y}" text-anchor="${anc}" direction="ltr" style="font:600 14px var(--mono);fill:var(--ink);${st}">${t}</text>`;
function loopModel(fn){ let raf,last=performance.now(); const f=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; fn(dt,now/1000); raf=requestAnimationFrame(f); }; raf=requestAnimationFrame(f); App.cleanup.push(()=>cancelAnimationFrame(raf)); }
function seg(id,opts,cur){ return `<div class="seg" id="${id}">${opts.map(([k,t])=>`<button type="button" data-v="${k}" aria-pressed="${k===cur}">${t}</button>`).join("")}</div>`; }
function bindSeg(id,cb){ $$("#"+id+" button").forEach(b=>b.onclick=()=>{ $$("#"+id+" button").forEach(x=>x.setAttribute("aria-pressed",x===b)); cb(b.dataset.v); }); }
/* quick apply-and-check quiz */
function mQuiz(host,qs){ const st=qs.map(()=>({sel:null,done:false,ok:null,tries:0,val:""}));
  function r(){ const nOk=st.filter(s=>s.ok).length;
    host.innerHTML=`<div class="card stack" style="gap:12px"><div class="row" style="justify-content:space-between"><b>🎯 طبّقي وتحققي</b><span class="tag m">${nOk} / ${qs.length}</span></div>${qs.map((q,i)=>{ const s=st[i];
      if(q.o) return `<div class="q"><div class="qt"><b>${i+1}.</b> ${q.q}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt ${s.done?(k===q.a?"right":k===s.sel?"wrong":""):s.sel===k?"sel":""}" data-i="${i}" data-k="${k}" ${s.done?"disabled":""}>${o}</button>`).join("")}</div>
        ${s.done?`<div class="verdict ${s.ok?"ok":"no"}">${s.ok?"✔ أحسنتِ!":"الإجابة الصحيحة باللون الأخضر."}</div><div class="why">${q.why||""}</div>`:`<div class="row chkrow"><button class="btn sm pri" data-c="${i}" ${s.sel==null?"disabled":""}>✓ تحققي</button>${s.tries?`<span class="verdict no">✘ حاولي مرة أخرى</span>${s.tries>=2?`<button class="btn sm ghost" data-r="${i}">إظهار الإجابة</button>`:""}`:""}</div>`}</div>`;
      return `<div class="q"><div class="qt"><b>${i+1}.</b> ${q.q}</div><div class="row"><input class="inp" id="mq${i}" value="${esc(s.val)}" inputmode="decimal" style="max-width:160px;direction:ltr;text-align:left;font-family:var(--mono)" ${s.ok?"readonly":""}><span class="muted mono">${q.unit||""}</span>${s.ok?"":`<button class="btn sm pri" data-n="${i}">✓ تحققي</button>`}</div>
        ${s.ok!=null?`<div class="verdict ${s.ok?"ok":"no"}">${s.ok?"✔ إجابة صحيحة":"✘ راجعي حسابك"}${!s.ok&&q.hint?`<span class="hint">💡 ${q.hint}</span>`:""}</div>`:""}${s.ok&&q.why?`<div class="why">${q.why}</div>`:""}</div>`; }).join("")}</div>`;
    $$(".opt[data-k]",host).forEach(b=>b.onclick=()=>{ st[b.dataset.i].sel=+b.dataset.k; r(); });
